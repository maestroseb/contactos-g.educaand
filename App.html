<script>
/* ===================== Utilidades ===================== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/** Hue estable (0-359) a partir de una cadena (para colorear chips de etiqueta). */
function hue(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))>>>0; return h%360; }
/** SVG de la «x» de un chip. */
function cerrarSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }

/**
 * Editor de etiquetas dentro de una celda: chips con «x» para quitar y un «+»
 * para añadir (escribe y Enter). Muta el array `grupos` en el sitio y avisa por
 * onChange en cada cambio.
 */
function chipCellEditor(td, grupos, onChange){
  function existe(t){ return grupos.map(function(g){return g.toLowerCase();}).indexOf(t.toLowerCase()) !== -1; }
  function render(){
    td.innerHTML = '<div class="etq-cell">'+
      grupos.map(function(t){ return '<span class="chip" style="--h:'+hue(t)+'">'+esc(t)+'<span class="x" data-x="'+esc(t)+'">'+cerrarSvg()+'</span></span>'; }).join('')+
      '<button type="button" class="chipadd" title="Añadir etiqueta">'+icon('add')+'</button></div>';
    Array.prototype.forEach.call(td.querySelectorAll('.chip .x'), function(x){
      x.onclick = function(e){ e.stopPropagation(); var t=x.getAttribute('data-x'); var i=grupos.map(function(g){return g.toLowerCase();}).indexOf(t.toLowerCase());
        if(i>=0){ grupos.splice(i,1); render(); if(onChange) onChange(); } };
    });
    td.querySelector('.chipadd').onclick = abrir;
  }
  function abrir(){
    var box = td.querySelector('.etq-cell'), add = box.querySelector('.chipadd');
    var inp = document.createElement('input'); inp.className='chip-new'; inp.placeholder='Etiqueta…';
    box.insertBefore(inp, add); inp.focus();
    var done=false;
    function commit(){ if(done) return; done=true; var v=inp.value.trim();
      if(v && !existe(v)){ grupos.push(v); } render(); if(onChange) onChange(); }
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } else if(e.key==='Escape'){ done=true; render(); } });
    inp.addEventListener('blur', commit);
  }
  render();
}

/**
 * Convierte un input en «chip editable»: vacío o mientras se escribe se ve como
 * un campo normal; al pulsar Enter o salir, si tiene contenido, se muestra como
 * pastilla de color. Al volver a enfocarlo se edita como texto normal.
 */
function armarChipInput(inp){
  function tam(){ inp.size = Math.max(3, (inp.value || '').length || 3); }
  function comoChip(){
    inp.style.setProperty('--h', inp.value ? hue(inp.value) : 186);
    inp.classList.toggle('aschip', !!inp.value.trim());
  }
  inp.addEventListener('input', tam);
  inp.addEventListener('focus', function(){ inp.classList.remove('aschip'); });
  inp.addEventListener('blur', comoChip);
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
  tam(); comoChip();   // estado inicial (chip solo si ya trae valor)
}
function icon(name, cls){
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(window.ICON[name]||'')+'</svg>';
}
function setStatus(el, texto, tipo){
  if(!el) return;
  var ic = tipo==='ok'?'ok':(tipo==='err'?'alerta':(tipo==='busy'?'sync':null));
  el.className = 'status'+(tipo?' '+tipo:'');
  el.innerHTML = (ic?icon(ic, tipo==='busy'?'spin':''):'')+'<span>'+esc(texto)+'</span>';
}
function mensajeError(e){
  var m=(e&&e.message)?e.message:String(e);
  if(m.indexOf('NO_MIEMBRO')!==-1) return 'No puedes sincronizar los contactos del centro porque no perteneces al claustro.';
  if(m.indexOf('NO_AUTORIZADO')!==-1) return 'No tienes permisos de administrador.';
  if(m.indexOf('NO_PRINCIPAL')!==-1) return 'Solo el administrador principal puede hacer esto.';
  return 'Se ha producido un error: '+m;
}
function resumenTexto(r){
  return 'Hecho: '+r.creados+' creados, '+r.actualizados+' actualizados, '+r.sinCambios+' sin cambios'+
    (r.omitidos?', '+r.omitidos+' omitidos':'')+
    (r.errores?', '+r.errores+' con error':'')+'.';
}

/**
 * Abre un modal con un área de texto para pegar (importaciones puntuales).
 * cfg = { titulo, desc, placeholder, aceptar, onAceptar(texto, ctx) }
 *   ctx = { cerrar(), st (elemento de estado), btn (botón aceptar) }
 * Devuelve { cerrar }.
 */
function modalPegar(cfg){
  cfg = cfg || {};
  var ov = document.createElement('div');
  ov.className = 'modal-ov';
  ov.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">'+
      '<div class="modal-head"><h3>'+icon('importar')+esc(cfg.titulo||'Importar')+'</h3>'+
        '<button class="btn ghost sm icononly modal-x" title="Cerrar">'+icon('cerrar')+'</button></div>'+
      (cfg.desc?'<p class="desc">'+esc(cfg.desc)+'</p>':'')+
      '<textarea class="modal-ta" rows="8" placeholder="'+esc(cfg.placeholder||'')+'" '+
        'style="font-family:var(--mono);font-size:12.5px"></textarea>'+
      '<p class="status modal-st"></p>'+
      '<div class="modal-foot">'+
        '<button class="btn ghost modal-cancel">Cancelar</button>'+
        '<button class="btn primary modal-ok">'+icon('importar')+esc(cfg.aceptar||'Añadir')+'</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
  var ta = ov.querySelector('.modal-ta'), st = ov.querySelector('.modal-st');
  function cerrar(){ if(ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key==='Escape') cerrar(); }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', function(e){ if(e.target===ov) cerrar(); });
  ov.querySelector('.modal-x').onclick = cerrar;
  ov.querySelector('.modal-cancel').onclick = cerrar;
  ov.querySelector('.modal-ok').onclick = function(){
    if(cfg.onAceptar) cfg.onAceptar(ta.value, { cerrar: cerrar, st: st, btn: this });
  };
  setTimeout(function(){ ta.focus(); }, 30);
  return { cerrar: cerrar };
}
/** Ejecuta una llamada al servidor gestionando botón y estado. */
function correr(btn, st, cargando, runFn, okFn){
  if(btn) btn.disabled=true;
  setStatus(st, cargando, 'busy');
  runFn(google.script.run
    .withSuccessHandler(function(res){ if(btn) btn.disabled=false; okFn(res, st); })
    .withFailureHandler(function(e){ if(btn) btn.disabled=false; setStatus(st, mensajeError(e), 'err'); }));
}

/** Orden de columnas de las rejillas de contactos. */
var ORDEN_COLS = ['nombre','apellidos','email','telefono','puesto','grupos'];

/**
 * Habilita pegar en bloque (desde Excel/Séneca) en una rejilla: al pegar en una
 * celda, reparte el texto (tabuladores = columnas, saltos = filas) creando filas
 * nuevas si hacen falta. `anadirFila(tbody, obj)` añade una fila vacía.
 */
function habilitarPegado(tbody, anadirFila){
  tbody.addEventListener('paste', function(e){
    var inp = e.target;
    if(!inp || inp.tagName !== 'INPUT') return;
    var texto = (e.clipboardData || window.clipboardData).getData('text');
    if(!texto || (texto.indexOf('\t') === -1 && texto.indexOf('\n') === -1)) return; // valor simple → pegado normal
    e.preventDefault();
    var startCol = ORDEN_COLS.indexOf(inp.getAttribute('data-k'));
    if(startCol < 0) startCol = 0;
    var trs = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    var startRow = trs.indexOf(inp.closest('tr'));
    var lineas = texto.replace(/\r/g,'').split('\n');
    if(lineas.length && lineas[lineas.length-1] === '') lineas.pop();
    lineas.forEach(function(linea, r){
      while(tbody.querySelectorAll('tr').length <= startRow + r) anadirFila(tbody, {});
      var fila = tbody.querySelectorAll('tr')[startRow + r];
      var inputs = fila.querySelectorAll('input');
      linea.split('\t').forEach(function(val, c){
        var destino = inputs[startCol + c];
        if(destino) destino.value = val.trim();
      });
    });
  });
}

/**
 * Lanza una sincronización mostrando una barra de progreso. La barra sondea
 * getProgresoSync() mientras corre la sincronización (que va anotando el avance
 * en caché). Si el sondeo no llega en paralelo, la barra se anima y salta a
 * 100% al terminar.
 */
function lanzarSincronizacion(btn, st, opciones, onDone){
  if(btn) btn.disabled = true;
  var barra = document.createElement('div');
  barra.className = 'progress indeterminate';
  barra.innerHTML = '<div class="bar"></div>';
  st.parentNode.insertBefore(barra, st);
  var relleno = barra.querySelector('.bar');
  var fin = false, determinada = false;
  setStatus(st, 'Preparando…', 'busy');

  var poll = setInterval(function(){
    google.script.run.withSuccessHandler(function(p){
      if(fin || !p) return;
      if(p.fase === 'guardando'){
        if(!determinada){ barra.classList.remove('indeterminate'); determinada = true; }
        relleno.style.width = '92%';
        setStatus(st, 'Guardando cambios…', 'busy');
        return;
      }
      if(p.fase === 'fusionando'){ setStatus(st, 'Evitando duplicados…', 'busy'); return; }
      if(p.total){
        if(!determinada){ barra.classList.remove('indeterminate'); determinada = true; }
        var pct = Math.max(3, Math.round(p.hechos / p.total * 100));
        relleno.style.width = pct + '%';
        setStatus(st, 'Sincronizando… ' + p.hechos + ' de ' + p.total, 'busy');
      }
    }).getProgresoSync();
  }, 1200);

  google.script.run
    .withSuccessHandler(function(res){
      fin = true; clearInterval(poll);
      barra.classList.remove('indeterminate');
      relleno.style.width = '100%';
      setStatus(st, resumenTexto(res), 'ok');
      setTimeout(function(){ if(barra.parentNode) barra.parentNode.removeChild(barra); }, 1400);
      if(btn) btn.disabled = false;
      if(onDone) onDone(true);
    })
    .withFailureHandler(function(e){
      fin = true; clearInterval(poll);
      if(barra.parentNode) barra.parentNode.removeChild(barra);
      setStatus(st, mensajeError(e), 'err');
      if(btn) btn.disabled = false;
      if(onDone) onDone(false);
    })
    .sincronizarAhora(opciones);
}

/* ===================== Arranque ===================== */
window.TABS = window.TABS || {};
var ESTADO = null, TAB_ACTIVA = null, PANELS = {};

/** Fuerza que una pestaña se vuelva a construir la próxima vez que se abra
 *  (p. ej. tras cambiar la configuración, para refrescar «Contactos del centro»). */
function invalidarTab(key){
  var p = PANELS[key];
  if(p){ if(p.parentNode) p.parentNode.removeChild(p); delete PANELS[key]; }
}

document.addEventListener('DOMContentLoaded', function(){ recargarApp(); });

/** (Re)carga el estado del servidor y pinta la app. Evita location.reload(),
 *  que en el iframe de Apps Script puede dejar la pantalla en blanco. */
function recargarApp(preferida){
  google.script.run
    .withSuccessHandler(function(estado){
      ESTADO=estado;
      try { construirShell(estado, preferida); }
      catch(err){ pantallaError(err); }
    })
    .withFailureHandler(function(e){ pantallaError(e); })
    .getEstadoInicial();
}
function pantallaError(e){
  document.getElementById('root').innerHTML =
    '<div class="center-screen"><div class="panel"><div class="big">'+icon('alerta')+'</div>'+
    '<h2>No se pudo cargar</h2><p>'+esc(mensajeError(e))+'</p></div></div>';
}

function tabsOrdenadas(estado){
  return Object.keys(window.TABS)
    .map(function(k){ return Object.assign({key:k}, window.TABS[k]); })
    .filter(function(t){ return !t.adminOnly || estado.esAdmin; })
    .sort(function(a,b){ return (a.orden||99)-(b.orden||99); });
}

function construirShell(estado, preferida){
  PANELS = {};   // el shell se reconstruye: descartamos los paneles anteriores
  var tabs = tabsOrdenadas(estado);
  // Identidad del usuario: nombre visible (o correo), inicial y foto de perfil.
  var nombreUsuario = (estado.nombreUsuario || '').trim();
  var etiquetaUsuario = nombreUsuario || estado.email || '—';
  var inicial = (nombreUsuario || estado.email || '?').trim().charAt(0).toUpperCase() || '?';
  var avatarHtml = estado.fotoUsuario
    ? '<img class="avatar" src="'+esc(estado.fotoUsuario)+'" alt="" referrerpolicy="no-referrer" '+
      'onerror="this.outerHTML=\'<span class=&quot;avatar&quot;>'+esc(inicial)+'</span>\'">'
    : '<span class="avatar">'+esc(inicial)+'</span>';
  var necesitaConfig = estado.esAdmin && !estado.configurado;

  var nav = tabs.map(function(t){
    var dot = (t.key==='configuracion' && necesitaConfig) ? '<span class="dot" title="Pendiente de configurar"></span>' : '';
    return '<button data-tab="'+t.key+'">'+icon(t.icono)+'<span>'+esc(t.label)+'</span>'+dot+'</button>';
  }).join('');

  document.getElementById('root').innerHTML =
    '<div class="appwrap">'+
      '<div class="topfixed">'+
        '<header class="appbar">'+
          '<div class="brand"><span class="logo">'+icon('claustro')+'</span>'+
            '<span class="txt"><b>'+esc(estado.nombreCentro||estado.nombreApp)+'</b>'+
            '<small>'+esc(estado.nombreCentro?estado.nombreApp:'Sin centro configurado')+'</small></span></div>'+
          '<div class="appbar-right">'+
            '<div class="hdr-sync">'+
              '<div class="syncwrap">'+
                '<button class="btn sm primary splitmain" id="hSync">'+icon('sync')+'Sincronizar</button>'+
                '<button class="btn sm primary splitcaret" id="hSyncMenu" title="Elegir grupos a sincronizar">'+icon('chevron','rot90')+'</button>'+
                '<div class="syncpop" id="syncPop" hidden></div>'+
              '</div>'+
              '<button class="btn sm'+(estado.diariaActiva?' good':'')+'" id="hDiaria" title="Sincronización automática cada día">'+
                icon('power')+(estado.diariaActiva?'Diaria: activada':'Diaria: desactivada')+'</button>'+
            '</div>'+
            '<span class="sep"></span>'+
            '<div class="userbox" title="'+esc(estado.email||'')+'">'+
              avatarHtml+
              '<span class="uinfo">'+
                '<b>'+esc(etiquetaUsuario)+'</b>'+
                '<small class="'+(estado.esAdmin?'is-admin':'')+'">'+icon(estado.esAdmin?'config':'yo')+
                  (estado.esAdmin?'Administrador':'Profesorado')+'</small>'+
              '</span>'+
            '</div>'+
          '</div>'+
        '</header>'+
        '<nav class="tabbar">'+nav+'</nav>'+
        '<div class="syncarea" id="syncArea" hidden><span class="status" id="syncStatus"></span></div>'+
      '</div>'+
      '<div class="page">'+
        '<div class="pagehead"><h1 id="tb-tit"></h1><div class="sub" id="tb-sub"></div></div>'+
        '<div class="content" id="content"></div>'+
      '</div>'+
      creditosHtml()+
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    b.onclick = function(){ irATab(b.getAttribute('data-tab')); };
  });

  // Sincronización manual desde la cabecera (todo: centro + propios).
  document.getElementById('hSync').onclick = function(){ ejecutarSync({incluirCentro:true, incluirPropios:true}); };

  // Popover para elegir qué grupos sincronizar.
  var grupos = estado.gruposCentro || [];
  var pop = document.getElementById('syncPop');
  pop.innerHTML =
    '<div class="syncpop-tit">Sincronizar…</div>'+
    (grupos.length
      ? '<div class="syncpop-list">'+grupos.map(function(g){ return '<label><input type="checkbox" class="gsel" value="'+esc(g)+'" checked> '+esc(g)+'</label>'; }).join('')+'</div>'
      : '<p class="muted" style="margin:4px 0">Aún no hay grupos en el centro.</p>')+
    '<label class="syncpop-prop"><input type="checkbox" id="pProp" checked> Mis contactos propios</label>'+
    '<button class="btn primary sm" id="pSync" style="width:100%;justify-content:center;margin-top:8px">'+icon('sync')+'Sincronizar selección</button>';

  document.getElementById('hSyncMenu').onclick = function(e){ e.stopPropagation(); pop.hidden = !pop.hidden; };
  document.addEventListener('click', function(e){ if(!pop.hidden && !pop.contains(e.target) && e.target.id!=='hSyncMenu') pop.hidden=true; });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('pSync').onclick = function(){
    var sel = Array.prototype.map.call(pop.querySelectorAll('.gsel:checked'), function(c){ return c.value; });
    var propios = document.getElementById('pProp').checked;
    var todosMarcados = sel.length === grupos.length;
    pop.hidden = true;
    ejecutarSync({ incluirCentro: sel.length>0, gruposCentro: todosMarcados?[]:sel, incluirPropios: propios });
  };

  function ejecutarSync(opciones){
    var area=document.getElementById('syncArea'); area.hidden=false;
    lanzarSincronizacion(document.getElementById('hSync'), document.getElementById('syncStatus'),
      opciones, function(){ setTimeout(function(){ area.hidden=true; }, 3000); });
  }
  // Conmutar sincronización diaria desde la cabecera.
  document.getElementById('hDiaria').onclick = function(){
    var activar = !estado.diariaActiva; this.disabled=true;
    var run=google.script.run
      .withSuccessHandler(function(){ recargarApp(TAB_ACTIVA); })
      .withFailureHandler(function(e){ alert(mensajeError(e)); });
    if(activar) run.activarSincronizacionDiaria({incluirCentro:true, incluirPropios:true});
    else run.desactivarSincronizacionDiaria();
  };

  // Pestaña inicial: la preferida (si existe), o Configuración si falta, o la 1ª.
  var primera = (preferida && window.TABS[preferida] && (!window.TABS[preferida].adminOnly || estado.esAdmin))
    ? preferida : (necesitaConfig ? 'configuracion' : tabs[0].key);
  irATab(primera);
}

function irATab(key){
  TAB_ACTIVA = key;
  var t = window.TABS[key];
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    b.classList.toggle('active', b.getAttribute('data-tab')===key);
  });
  document.getElementById('tb-tit').textContent = t.titulo || t.label;
  document.getElementById('tb-sub').textContent = t.sub || '';

  var cont = document.getElementById('content');
  // Oculta todos los paneles ya montados.
  Array.prototype.forEach.call(cont.children, function(p){ p.hidden = true; });

  // Si esta pestaña ya se cargó, solo se muestra (instantáneo, conserva su estado).
  var panel = PANELS[key];
  if(!panel){
    panel = document.createElement('div');
    panel.className = 'tabpanel';
    cont.appendChild(panel);
    PANELS[key] = panel;
    try { t.render(panel, ESTADO); }
    catch(err){
      panel.innerHTML = '<div class="card"><p class="status err">'+icon('alerta')+
        '<span>Error al mostrar esta sección: '+esc(err&&err.message?err.message:err)+'</span></p></div>';
    }
  }
  panel.hidden = false;
}
</script>
