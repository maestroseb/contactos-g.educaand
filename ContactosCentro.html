<script>
/** Pestaña CONTACTOS DEL CENTRO (solo admin).
 *  Etiquetas como chips de color; paleta coordinada con Configuración;
 *  modo "asignar picando" (eliges una etiqueta y pinchas en las personas). */
window.TABS = window.TABS || {};
window.TABS.contactosCentro = {
  orden: 3, label: 'Contactos del centro', icono: 'claustro',
  titulo: 'Contactos del centro', sub: 'El claustro que sincroniza todo el profesorado',
  render: function (cont, estado) {
    var FILAS = [];        // {id,nombre,apellidos,email,telefono,puesto,grupos:[]}
    var SEL = new Set();   // ids seleccionados
    var armado = null;     // etiqueta armada
    var seq = 0;
    var cats = estado.etiquetasCats || {};
    var pintando = false, accionPintar = true, pintadas = {};  // arrastre para pintar
    var lastPX = 0, lastPY = 0, rafScroll = null;              // auto-scroll al pintar

    cont.innerHTML = [
      '<div class="card">',
        '<div class="card-head">',
          '<h2>'+icon('claustro')+'Claustro'+(estado.nombreCentro?' de '+esc(estado.nombreCentro):'')+'</h2>',
          '<button class="btn sm" id="bImport">'+icon('importar')+'Importar desde Séneca…</button>',
        '</div>',
        '<p class="desc">Elige una etiqueta abajo y <b>pincha (o arrastra arriba/abajo) sobre las personas</b> para asignársela; vuelve a pinchar para quitarla. También puedes marcar filas y aplicarla en bloque. <b>Doble clic</b> en una etiqueta para <b>renombrarla</b> en todo el claustro. Con el botón <b>⏸ Pausar</b> das de baja temporal a una persona (p. ej. de baja médica): conserva sus datos y etiquetas pero deja de sincronizarse y se le retiran las etiquetas de Google; pulsa <b>▶</b> para reactivarla.</p>',
        '<div class="palette" id="paleta"></div>',
        '<div id="buscadorZona"></div>',
        '<div id="gridZona"><p class="muted">Cargando claustro…</p></div>',
        '<div class="row" style="margin-top:14px">',
          '<button class="btn sm" id="bAdd">'+icon('add')+'Añadir persona</button>',
          '<button class="btn danger" id="bVaciar" style="margin-left:auto">'+icon('borrar')+'Vaciar lista</button>',
        '</div>',
        '<p class="status" id="sAdmin"></p>',
      '</div>',
      '<button class="btn primary floatsave" id="claustroSave" hidden>'+icon('guardar')+'Guardar claustro</button>'
    ].join('');

    var zona = cont.querySelector('#gridZona');
    var filasInicial = null;   // instantánea para detectar cambios (y reversiones)
    var busqueda = '';         // texto del buscador (lupa)
    var filtroPausa = 'todas'; // 'todas' | 'activas' | 'pausa'

    // Buscador con lupa + filtro por estado (todas/activas/en pausa) + contador.
    var bzona = cont.querySelector('#buscadorZona');
    var bwrap = document.createElement('div'); bwrap.className = 'buscador-row';
    bwrap.appendChild(cajaBusqueda('Buscar por nombre, alias, correo, teléfono, puesto o etiqueta…', function(v){ busqueda = v; aplicarBusqueda(); }));
    var seg = document.createElement('div'); seg.className = 'segmento';
    seg.innerHTML = [['todas','Todas'],['activas','Activas'],['pausa','En pausa']]
      .map(function(o){ return '<button data-f="'+o[0]+'"'+(o[0]==='todas'?' class="on"':'')+'>'+o[1]+'</button>'; }).join('');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
      b.onclick = function(){ filtroPausa = b.getAttribute('data-f');
        Array.prototype.forEach.call(seg.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
        aplicarBusqueda(); };
    });
    bwrap.appendChild(seg);
    var cuenta = document.createElement('span'); cuenta.className = 'buscador-cuenta muted';
    bwrap.appendChild(cuenta);
    bzona.appendChild(bwrap);

    function textoFila(f){ return [f.nombre, f.apellidos, f.alias, f.email, f.telefono, f.puesto].concat(f.grupos||[]).join(' ')+(f.pausado?' pausa en pausa pausado':''); }
    function pasaPausa(f){ return filtroPausa==='todas' || (filtroPausa==='pausa' ? !!f.pausado : !f.pausado); }
    function actualizarCuenta(){
      var reales = FILAS.filter(function(f){ return f.email || f.nombre; });
      var pausadas = reales.filter(function(f){ return f.pausado; }).length;
      cuenta.textContent = reales.length + (reales.length===1?' persona':' personas') + (pausadas ? ' · '+pausadas+' en pausa' : '');
    }
    function aplicarBusqueda(){
      Array.prototype.forEach.call(zona.querySelectorAll('tbody tr'), function(tr){
        var f = filaId(tr.getAttribute('data-id'));
        tr.hidden = !!f && !(pasaPausa(f) && coincideBusqueda(textoFila(f), busqueda));
      });
      actualizarCuenta();
    }

    // Pegar en bloque tipo hoja de cálculo (p. ej. una columna de teléfonos). Se
    // engancha una sola vez sobre la zona (persiste entre repintados de la rejilla)
    // y escribe directamente en el modelo FILAS, creando filas si hacen falta.
    var COLS_TXT = ['nombre','apellidos','alias','email','telefono','puesto'];
    zona.addEventListener('paste', function(e){
      var inp = e.target;
      if(!inp || inp.tagName !== 'INPUT' || !inp.getAttribute('data-k')) return;
      var startCol = COLS_TXT.indexOf(inp.getAttribute('data-k')); if(startCol < 0) return;
      var texto = (e.clipboardData || window.clipboardData).getData('text');
      if(!texto || (texto.indexOf('\t') === -1 && texto.indexOf('\n') === -1)) return; // valor simple → pegado normal
      e.preventDefault();
      var id = inp.closest('tr').getAttribute('data-id');
      var startRow = FILAS.map(function(f){ return f.id; }).indexOf(id); if(startRow < 0) return;
      var lineas = texto.replace(/\r/g,'').split('\n');
      if(lineas.length && lineas[lineas.length-1] === '') lineas.pop();
      lineas.forEach(function(linea, r){
        while(FILAS.length <= startRow + r) FILAS.push(filaVacia());
        var f = FILAS[startRow + r];
        linea.split('\t').forEach(function(val, c){ var campo = COLS_TXT[startCol + c]; if(campo) f[campo] = val.trim(); });
      });
      renderGrid(); revisarClaustro();
    });

    // Serializa lo que se guardaría; si coincide con lo cargado, no hay cambios.
    function serializarFilas(){
      return JSON.stringify(FILAS.map(paraGuardar).filter(function(f){ return f.email||f.nombre; }));
    }
    function revisarClaustro(){
      var b = cont.querySelector('#claustroSave');
      if(!b || filasInicial === null) return;
      b.hidden = (serializarFilas() === filasInicial);
    }

    google.script.run
      .withSuccessHandler(function (lista) {
        FILAS = (lista||[]).map(function(c){ return normaliza(c); });
        if(!FILAS.length) FILAS = [filaVacia()];
        pintarPaleta(); renderGrid();
        filasInicial = serializarFilas(); revisarClaustro();
      })
      .withFailureHandler(function (e) { zona.innerHTML = '<p class="status err">'+esc(mensajeError(e))+'</p>'; })
      .adminLeerContactos();

    // acciones
    cont.querySelector('#bAdd').onclick = function(){ FILAS.push(filaVacia()); renderGrid(); };
    cont.querySelector('#claustroSave').onclick = function(){
      var filas = FILAS.map(paraGuardar).filter(function(f){ return f.email||f.nombre; });
      correr(this, cont.querySelector('#sAdmin'), 'Guardando…',
        function(r){ r.adminGuardarContactos(filas); },
        function(res, st){
          filasInicial = serializarFilas(); revisarClaustro();
          var n = (res && typeof res === 'object') ? res.n : res;
          var pausadas = filas.filter(function(f){ return f.pausado; }).length;
          var msg = 'Guardado: '+n+' personas en el claustro'+(pausadas ? ' ('+(n-pausadas)+' activas · '+pausadas+' en pausa)' : '')+'.';
          // El servidor sincroniza las etiquetas y los puestos nuevos con Configuración.
          if(res && res.cambioCfg){
            cats = res.etiquetas || cats;
            ESTADO.etiquetasCats = cats;
            ESTADO.etiquetasSugeridas = [].concat(cats.grupo||[], cats.departamentos||[], cats.cargos||[], cats.otros||[]);
            pintarPaleta();
            if(typeof invalidarTab==='function') invalidarTab('configuracion');
            msg += ' Etiquetas y especialidades sincronizadas con Configuración.';
          }
          setStatus(st, msg, 'ok');
        });
    };
    cont.querySelector('#bVaciar').onclick = function(){
      var btn = this;
      modalConfirmar({ titulo:'Vaciar el claustro', icono:'borrar', peligro:true, aceptar:'Vaciar',
        mensaje:'¿Vaciar TODA la lista del claustro?\n\nSolo borra la lista del centro; no elimina contactos de Google de nadie.',
        onAceptar:function(){
          correr(btn, cont.querySelector('#sAdmin'), 'Vaciando…',
            function(r){ r.adminGuardarContactos([]); },
            function(n, st){ FILAS=[filaVacia()]; SEL.clear(); pintarPaleta(); renderGrid(); filasInicial = serializarFilas(); revisarClaustro(); setStatus(st, 'Lista del claustro vaciada.', 'ok'); });
        }});
    };
    cont.querySelector('#bImport').onclick = function(){
      modalPegar({
        titulo: 'Importar desde Séneca',
        desc: 'Sube el Excel o CSV exportado de Séneca, o pega el listado (celdas de una hoja de cálculo, CSV con comas o punto y coma, o directamente de la pantalla de Séneca). Se detecta el formato solo y las columnas por su encabezado (Empleado/a, Cuenta Google/Microsoft, Puesto, Teléfono, Móvil…) o, si no hay, por su contenido; del teléfono se prioriza el móvil. Se añade a la lista; luego pulsa «Guardar claustro».',
        placeholder: 'Apellidos, Nombre\tcorreo@…\tPuesto',
        aceptar: 'Añadir a la lista',
        onAceptar: function(texto, ctx){
          if(!texto.trim()){ setStatus(ctx.st, 'Pega antes las filas.', 'err'); return; }
          ctx.btn.disabled = true; setStatus(ctx.st, 'Procesando…', 'busy');
          google.script.run
            .withSuccessHandler(function(lista){
              if(FILAS.length===1 && !FILAS[0].email && !FILAS[0].nombre) FILAS=[];
              (lista||[]).forEach(function(c){ FILAS.push(normaliza(c)); });
              pintarPaleta(); renderGrid();
              ctx.cerrar();
              setStatus(cont.querySelector('#sAdmin'), 'Añadidas '+(lista||[]).length+' filas. Revisa y pulsa «Guardar claustro».', 'ok');
            })
            .withFailureHandler(function(e){ ctx.btn.disabled=false; setStatus(ctx.st, mensajeError(e), 'err'); })
            .adminImportarPegado(texto);
        }
      });
    };

    /* ---------- paleta ---------- */
    function pintarPaleta(){
      var pal = cont.querySelector('#paleta');
      var orden = [['grupo','Grupo'],['departamentos','Departamentos'],['cargos','Cargos'],['otros','Otros']];
      var enConfig = {};
      var filasRows = orden.map(function(par){
        var items = (cats[par[0]]||[]);
        items.forEach(function(t){ enConfig[t.toLowerCase()]=true; });
        if(!items.length) return '';
        return '<div class="pal-row"><span class="pal-lbl">'+esc(par[1])+'</span><div class="pal-chips">'+
          items.map(function(t){ return chipClic(t); }).join('')+'</div></div>';
      }).join('');
      // etiquetas en uso que no estén en la config
      var usadas = {};
      FILAS.forEach(function(f){ (f.grupos||[]).forEach(function(t){ if(t && !enConfig[t.toLowerCase()]) usadas[t]=true; }); });
      var usoChips = Object.keys(usadas).sort();
      var filaUso = usoChips.length ? '<div class="pal-row"><span class="pal-lbl">En uso</span><div class="pal-chips">'+usoChips.map(function(t){ return chipClic(t); }).join('')+'</div></div>' : '';

      pal.innerHTML =
        (filasRows||filaUso ? (filasRows+filaUso) : '<p class="muted" style="margin:2px 0">No hay etiquetas configuradas. Añádelas en la pestaña «Configuración».</p>')+
        '<div class="pal-tools">'+
          '<div class="pal-search">'+
            '<input id="etqLibre" placeholder="Buscar o crear etiqueta…" autocomplete="off" '+
              'role="combobox" aria-expanded="false" aria-autocomplete="list">'+
            '<div class="pal-ac" id="etqAC" hidden></div>'+
          '</div>'+
          '<span class="assign-banner" id="armBanner"></span>'+
        '</div>';

      Array.prototype.forEach.call(pal.querySelectorAll('.chip.clic'), function(ch){
        ch.onclick = function(){ armar(ch.getAttribute('data-tag')); };
        ch.ondblclick = function(e){ e.stopPropagation(); iniciarRenombrar(ch); };
        ch.title = 'Clic: asignar · Doble clic: renombrar';
      });
      montarAutocompletar(pal);
      refrescarArmado();
    }

    /** Todas las etiquetas conocidas (configuradas + en uso), sin repetir y ordenadas. */
    function todasLasEtiquetas_(){
      var set = {};
      ['grupo','departamentos','cargos','otros'].forEach(function(k){ (cats[k]||[]).forEach(function(t){ if(t) set[t]=true; }); });
      FILAS.forEach(function(f){ (f.grupos||[]).forEach(function(t){ if(t) set[t]=true; }); });
      return Object.keys(set).sort(function(a,b){ return a.localeCompare(b, 'es'); });
    }

    /**
     * Autocompletado del buscador de etiquetas: al escribir sugiere las que ya
     * existen (clic para asignarlas) y, si lo tecleado no coincide con ninguna,
     * ofrece «Crear «X»». Enter usa la resaltada o crea lo tecleado.
     */
    function montarAutocompletar(pal){
      var inp = pal.querySelector('#etqLibre'), box = pal.querySelector('#etqAC');
      var items = [], idx = -1;
      var norm = function(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };

      function cerrar(){ box.hidden = true; box.innerHTML = ''; items = []; idx = -1; inp.setAttribute('aria-expanded', 'false'); }
      function marcar(){ Array.prototype.forEach.call(box.children, function(el, i){ el.classList.toggle('activo', i === idx); }); }
      function elegir(i){ var it = items[i]; if(!it) return; inp.value = ''; cerrar(); armar(it.tag); }
      function abrir(){
        var q = inp.value.trim(), qn = norm(q), todas = todasLasEtiquetas_();
        var lista = (qn ? todas.filter(function(t){ return norm(t).indexOf(qn) !== -1; }) : todas).slice(0, 8);
        var exacta = todas.some(function(t){ return norm(t) === qn; });
        items = lista.map(function(t){ return { tag: t }; });
        if(q && !exacta) items.push({ tag: q, crear: true });
        if(!items.length){ cerrar(); return; }
        box.innerHTML = items.map(function(it){
          return it.crear
            ? '<div class="pal-ac-item pal-ac-crear">'+icon('add')+'Crear «'+esc(it.tag)+'»</div>'
            : '<div class="pal-ac-item"><span class="chip solo" style="--h:'+hue(it.tag)+'">'+esc(it.tag)+'</span></div>';
        }).join('');
        box.hidden = false; idx = -1; inp.setAttribute('aria-expanded', 'true');
        Array.prototype.forEach.call(box.children, function(el, i){
          el.onmousedown = function(e){ e.preventDefault(); };   // no perder el foco antes del clic
          el.onclick = function(){ elegir(i); };
        });
      }

      inp.addEventListener('input', abrir);
      inp.addEventListener('focus', abrir);
      inp.addEventListener('blur', function(){ setTimeout(cerrar, 120); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'ArrowDown'){ e.preventDefault(); if(box.hidden) abrir(); idx = Math.min(items.length - 1, idx + 1); marcar(); }
        else if(e.key === 'ArrowUp'){ e.preventDefault(); idx = Math.max(0, idx - 1); marcar(); }
        else if(e.key === 'Enter'){ e.preventDefault(); if(idx >= 0) elegir(idx); else { var v = inp.value.trim(); if(v){ inp.value = ''; cerrar(); armar(v); } } }
        else if(e.key === 'Escape'){ cerrar(); }
      });
    }

    function armar(tag){
      armado = (armado && armado.toLowerCase()===tag.toLowerCase()) ? null : tag;
      refrescarArmado();
    }
    function refrescarArmado(){
      var pal = cont.querySelector('#paleta');
      Array.prototype.forEach.call(pal.querySelectorAll('.chip.clic'), function(ch){
        ch.classList.toggle('armed', armado && ch.getAttribute('data-tag').toLowerCase()===armado.toLowerCase());
      });
      var banner = pal.querySelector('#armBanner');
      var tabla = zona.querySelector('table');
      if(armado){
        banner.innerHTML = 'Asignando <span class="chip solo" style="--h:'+hue(armado)+'">'+esc(armado)+'</span> · pincha en las filas. '+
          '<button class="btn sm" id="bAplicarSel">Aplicar a seleccionadas</button>'+
          '<button class="btn sm" id="bQuitarSel">Quitar de seleccionadas</button>'+
          '<button class="btn ghost sm" id="bSalir">Salir</button>';
        banner.querySelector('#bAplicarSel').onclick = function(){ aplicarSeleccion(true); };
        banner.querySelector('#bQuitarSel').onclick = function(){ aplicarSeleccion(false); };
        banner.querySelector('#bSalir').onclick = function(){ armado=null; refrescarArmado(); };
        if(tabla) tabla.classList.add('asignando');
      } else {
        banner.innerHTML = '';
        if(tabla) tabla.classList.remove('asignando');
      }
    }
    function aplicarSeleccion(add){
      if(!SEL.size){ setStatus(cont.querySelector('#sAdmin'), 'Marca antes alguna fila.', 'err'); return; }
      FILAS.forEach(function(f){ if(SEL.has(f.id)) toggleTag(f, armado, add); });
      renderGrid();
    }

    /* ---------- renombrar etiqueta (cascada a las personas) ---------- */
    function iniciarRenombrar(chipEl){
      var old = chipEl.getAttribute('data-tag');
      var inp = document.createElement('input');
      inp.value = old; inp.setAttribute('aria-label', 'Nuevo nombre de la etiqueta');
      inp.style.cssText = 'font:inherit; padding:2px 10px; border:1px solid var(--primary); border-radius:999px; min-width:110px';
      chipEl.parentNode.insertBefore(inp, chipEl);
      chipEl.style.display = 'none';
      inp.focus(); inp.select();
      var hecho = false;
      function commit(){
        if(hecho) return; hecho = true;
        var nv = inp.value.trim();
        if(!nv || nv.toLowerCase() === old.toLowerCase()){ pintarPaleta(); refrescarArmado(); return; }
        aplicarRenombrado(old, nv);
      }
      function cancelar(){ if(hecho) return; hecho = true; pintarPaleta(); refrescarArmado(); }
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); commit(); }
        else if(e.key === 'Escape'){ e.preventDefault(); cancelar(); }
      });
      inp.addEventListener('blur', commit);
    }

    function tieneEn_(arr, tag){
      var tl = tag.toLowerCase();
      for(var i=0;i<arr.length;i++){ if(String(arr[i]).toLowerCase() === tl) return true; }
      return false;
    }

    function aplicarRenombrado(old, nueva){
      var oldL = old.toLowerCase(), n = 0;
      // 1) Cascada a las personas.
      FILAS.forEach(function(f){
        var g = f.grupos || [], out = [], hit = false;
        g.forEach(function(t){
          if(t.toLowerCase() === oldL){ hit = true; if(!tieneEn_(out, nueva)) out.push(nueva); }
          else if(!tieneEn_(out, t)) out.push(t);
        });
        if(hit) n++;
        f.grupos = out;
      });
      // 2) Renombra también la sugerencia en las categorías de Configuración.
      var cambioCfg = false;
      Object.keys(cats).forEach(function(k){
        var arr = cats[k]; if(!Array.isArray(arr)) return;
        for(var i=0;i<arr.length;i++){ if(String(arr[i]).toLowerCase() === oldL){ arr[i] = nueva; cambioCfg = true; } }
      });
      if(armado && armado.toLowerCase() === oldL) armado = nueva;
      pintarPaleta(); renderGrid();
      setStatus(cont.querySelector('#sAdmin'),
        'Etiqueta renombrada'+(n ? ' en '+n+' persona'+(n===1?'':'s') : '')+'. Pulsa «Guardar claustro» para guardarlo.', 'ok');
      // 3) Persiste la sugerencia (las personas se guardan con «Guardar claustro»).
      if(cambioCfg){
        google.script.run
          .withSuccessHandler(function(res){
            ESTADO.etiquetasCats = res.etiquetas;
            ESTADO.etiquetasSugeridas = [].concat(res.etiquetas.grupo||[], res.etiquetas.departamentos||[], res.etiquetas.cargos||[], res.etiquetas.otros||[]);
            if(typeof invalidarTab==='function') invalidarTab('configuracion');  // refresca sus textareas
          })
          .withFailureHandler(function(e){
            setStatus(cont.querySelector('#sAdmin'), 'Renombrada en la lista, pero la sugerencia de Configuración no se pudo actualizar: '+mensajeError(e), 'err');
          })
          .guardarConfiguracion({ etiquetas: cats });
      }
    }

    /* ---------- rejilla ---------- */
    function renderGrid(){
      var html = '<div class="tablewrap"><table class="rejilla claustro'+(armado?' asignando':'')+'"><thead><tr>'+
        '<th class="sel-col"><input type="checkbox" class="selall" title="Marcar todas"></th>'+
        '<th>Nombre</th><th>Apellidos</th><th>Alias</th><th>E-mail</th><th>Teléfono</th><th>Puesto</th><th>Etiquetas</th><th></th>'+
        '</tr></thead><tbody>'+
        FILAS.map(function(f){
          var cls = [SEL.has(f.id)?'marcada':'', f.pausado?'pausada':''].filter(Boolean).join(' ');
          return '<tr data-id="'+f.id+'"'+(cls?' class="'+cls+'"':'')+'>'+
            '<td class="sel-col"><input type="checkbox" class="sel"'+(SEL.has(f.id)?' checked':'')+'></td>'+
            celdaTxt(f,'nombre')+celdaTxt(f,'apellidos')+celdaTxt(f,'alias')+celdaTxt(f,'email')+celdaTxt(f,'telefono')+celdaTxt(f,'puesto')+
            '<td class="etqs"></td>'+
            '<td class="act">'+
              '<button class="btn sm icononly bpause'+(f.pausado?' on':'')+'" title="'+(f.pausado?'Reactivar (vuelve a sincronizarse)':'Pausar: baja temporal, se le retiran las etiquetas al sincronizar')+'">'+icon(f.pausado?'play':'pausa')+'</button>'+
              '<button class="btn danger sm icononly bdel" title="Quitar fila">'+icon('borrar')+'</button>'+
            '</td>'+
          '</tr>';
        }).join('')+'</tbody></table></div>';
      zona.innerHTML = html;

      var tabla = zona.querySelector('table');
      // inputs de texto
      Array.prototype.forEach.call(zona.querySelectorAll('input[data-k]'), function(inp){
        if(inp.getAttribute('data-k')==='puesto') armarChipInput(inp); else autofitInput(inp);
        inp.title = inp.value;   // al pasar el ratón se ve el valor completo aunque la columna lo recorte
        inp.oninput = function(){ var f=fila(inp); if(f) f[inp.getAttribute('data-k')] = inp.value; inp.title = inp.value; revisarClaustro(); };
      });
      // selección: marcar/desmarcar todas actúa in situ (sin repintar) para que
      // «desmarcar todas» funcione y la casilla de cabecera refleje el estado real.
      var selall = zona.querySelector('.selall');
      function sincronizarSelAll(){
        var total = FILAS.length, marcadas = FILAS.filter(function(f){ return SEL.has(f.id); }).length;
        selall.checked = total > 0 && marcadas === total;
        selall.indeterminate = marcadas > 0 && marcadas < total;
      }
      selall.onchange = function(){
        var check = selall.checked;
        FILAS.forEach(function(f){ check ? SEL.add(f.id) : SEL.delete(f.id); });
        Array.prototype.forEach.call(zona.querySelectorAll('tbody tr'), function(tr){
          var c = tr.querySelector('.sel'); if(c) c.checked = check; tr.classList.toggle('marcada', check);
        });
        selall.indeterminate = false;
      };
      Array.prototype.forEach.call(zona.querySelectorAll('.sel'), function(c){
        c.onchange = function(e){ e.stopPropagation(); var id=c.closest('tr').getAttribute('data-id'); c.checked?SEL.add(id):SEL.delete(id); c.closest('tr').classList.toggle('marcada', c.checked); sincronizarSelAll(); };
      });
      sincronizarSelAll();
      // quitar fila
      Array.prototype.forEach.call(zona.querySelectorAll('.bdel'), function(b){
        b.onclick = function(e){ e.stopPropagation(); var id=b.closest('tr').getAttribute('data-id'); FILAS=FILAS.filter(function(f){return f.id!==id;}); SEL.delete(id); renderGrid(); };
      });
      // pausar / reactivar (baja temporal: conserva datos y etiquetas)
      Array.prototype.forEach.call(zona.querySelectorAll('.bpause'), function(b){
        b.onclick = function(e){ e.stopPropagation(); var f=filaId(b.closest('tr').getAttribute('data-id')); if(!f) return; f.pausado=!f.pausado; renderGrid(); revisarClaustro(); };
      });
      // editor de etiquetas por celda (chips + añadir con autocompletado tipo Notion)
      Array.prototype.forEach.call(zona.querySelectorAll('tbody tr'), function(tr){
        var f = filaId(tr.getAttribute('data-id')); if(!f) return;
        var ed = chipCellEditor(tr.querySelector('.etqs'), f.grupos, revisarClaustro, { sugerencias: todasLasEtiquetas_ });
        tr._chipRender = ed.render;   // para repintar la celda tras «pintar» arrastrando
      });
      // pinchar (y arrastrar) para asignar/quitar la etiqueta armada
      Array.prototype.forEach.call(zona.querySelectorAll('tbody tr'), function(tr){
        tr.addEventListener('pointerdown', function(e){
          if(!armado) return;
          if(e.target.closest('input, button, .x')) return;
          e.preventDefault();
          var f = filaId(tr.getAttribute('data-id')); if(!f) return;
          accionPintar = !tieneTag(f, armado);   // según la 1ª: si no la tiene, pintamos (añadir); si la tiene, borramos
          pintando = true; pintadas = {};
          lastPX = e.clientX; lastPY = e.clientY;
          document.body.style.userSelect = 'none';
          iniciarAutoScroll();
          aplicarPintura(tr, f);
        });
      });
      aplicarBusqueda();   // reaplica búsqueda/filtro y refresca el contador
      revisarClaustro();
    }

    function pintarEn(x, y){
      var el = document.elementFromPoint(x, y);
      var tr = el && el.closest ? el.closest('tr[data-id]') : null;
      if(tr && zona.contains(tr)){ var f = filaId(tr.getAttribute('data-id')); if(f) aplicarPintura(tr, f); }
    }
    function onPaintMove(e){
      if(!pintando) return;
      lastPX = e.clientX; lastPY = e.clientY;
      pintarEn(lastPX, lastPY);
    }
    // Mientras se pinta, si el puntero está cerca del borde superior/inferior,
    // la página se desplaza sola para seguir asignando hacia abajo (o arriba).
    function autoScrollTick(){
      if(!pintando){ rafScroll = null; return; }
      var vh = window.innerHeight, EDGE = 80, MAXV = 26;
      var topEl = document.querySelector('.topfixed');
      var topGuard = topEl ? topEl.getBoundingClientRect().height : 0;
      var dy = 0;
      if(lastPY > vh - EDGE) dy = Math.min(MAXV, (lastPY - (vh - EDGE)) / EDGE * MAXV);
      else if(lastPY < topGuard + EDGE) dy = -Math.min(MAXV, ((topGuard + EDGE) - lastPY) / EDGE * MAXV);
      if(dy){
        var antes = window.pageYOffset;
        window.scrollBy(0, dy);
        if(window.pageYOffset !== antes) pintarEn(lastPX, lastPY);  // pinta lo que entra bajo el puntero
      }
      rafScroll = requestAnimationFrame(autoScrollTick);
    }
    function iniciarAutoScroll(){ if(rafScroll == null) rafScroll = requestAnimationFrame(autoScrollTick); }
    function finPintura(){
      if(pintando){ pintando=false; document.body.style.userSelect=''; if(document.contains(zona)) renderGrid(); }
      if(rafScroll != null){ cancelAnimationFrame(rafScroll); rafScroll = null; }
    }
    document.addEventListener('pointermove', onPaintMove);
    document.addEventListener('pointerup', finPintura);
    document.addEventListener('pointercancel', finPintura);

    function aplicarPintura(tr, f){
      if(pintadas[f.id]) return; pintadas[f.id]=true;
      toggleTag(f, armado, accionPintar);
      pintarCelda(tr, f);
    }
    function pintarCelda(tr, f){
      // El editor de la celda comparte el array f.grupos (mutado por toggleTag),
      // así que basta con pedirle que se repinte.
      if(tr._chipRender) tr._chipRender();
    }
    function tieneTag(f, tag){ return (f.grupos||[]).some(function(x){ return x.toLowerCase()===tag.toLowerCase(); }); }
    function filaId(id){ return FILAS.filter(function(x){ return x.id===id; })[0]; }

    function celdaTxt(f,k){
      var v = f[k]||'';
      if(k==='puesto'){
        return '<td class="puesto-cell"><input data-k="puesto" class="chipinput" size="'+Math.max(3,v.length)+'" '+
          'style="--h:'+(v?hue(v):186)+'" value="'+esc(v)+'"></td>';
      }
      return '<td><input data-k="'+k+'" value="'+esc(v)+'"></td>';
    }
    function fila(el){ var tr=el.closest('tr'); var id=tr.getAttribute('data-id'); return FILAS.filter(function(x){return x.id===id;})[0]; }

    function toggleTag(f, tag, add){
      f.grupos = f.grupos || [];
      var i = f.grupos.map(function(x){return x.toLowerCase();}).indexOf(tag.toLowerCase());
      var tiene = i !== -1;
      var poner = (add===null) ? !tiene : add;
      if(poner && !tiene) f.grupos.push(tag);
      else if(!poner && tiene) f.grupos.splice(i,1);
    }

    /* ---------- helpers ---------- */
    function normaliza(c){ return { id:'r'+(seq++), nombre:c.nombre||'', apellidos:c.apellidos||'', alias:c.alias||'', email:c.email||'', telefono:c.telefono||'', puesto:c.puesto||'', pausado:!!c.pausado, grupos:(c.grupos||[]).slice() }; }
    function filaVacia(){ return { id:'r'+(seq++), nombre:'', apellidos:'', alias:'', email:'', telefono:'', puesto:'', pausado:false, grupos:[] }; }
    function paraGuardar(f){ var o={ nombre:f.nombre.trim(), apellidos:f.apellidos.trim(), alias:(f.alias||'').trim(), email:f.email.trim(), telefono:f.telefono.trim(), puesto:f.puesto.trim(), tipoEmail:'Trabajo', grupos:(f.grupos||[]).map(function(x){return x.trim();}).filter(Boolean) }; if(f.pausado) o.pausado=true; return o; }
    function chipClic(t){ return '<span class="chip clic" data-tag="'+esc(t)+'" style="--h:'+hue(t)+'">'+esc(t)+'</span>'; }
    function cerrarSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }
  }
};
</script>
