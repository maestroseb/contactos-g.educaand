<script>
/** Pestaña CONFIGURACIÓN (solo admin). */
window.TABS = window.TABS || {};
window.TABS.configuracion = {
  orden: 2, label: 'Configuración', icono: 'config', adminOnly: true,
  titulo: 'Configuración del centro', sub: 'Ajustes generales · solo administración',
  render: function (cont, estado) {
    cont.innerHTML = '<div class="card"><p class="muted">Cargando configuración…</p></div>';
    google.script.run
      .withSuccessHandler(function (s) { pintarConfig(cont, estado, s); })
      .withFailureHandler(function (e) { cont.innerHTML = '<div class="card"><p class="status err">'+esc(mensajeError(e))+'</p></div>'; })
      .getEstadoConfig();
  }
};

function catEtq(e, k){ if(!e) return []; if(Array.isArray(e)) return (k==='grupo'?e:[]); return e[k]||[]; }
function lineasCfg(txt){ return String(txt||'').split('\n').map(function(s){return s.trim();}).filter(Boolean); }

var MESES_ = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/** Tarjeta «Curso escolar»: fecha de corte y apertura del nuevo curso. */
function cursoEscolarHtml(ce){
  if(!ce) return '';
  var c = ce.corte || { mes:8, dia:1 };
  var dias = ''; for(var d=1; d<=31; d++) dias += '<option'+(d===c.dia?' selected':'')+'>'+d+'</option>';
  var meses = MESES_.map(function(m, i){ return '<option value="'+(i+1)+'"'+((i+1)===c.mes?' selected':'')+'>'+m+'</option>'; }).join('');
  return '<div class="card" id="cursoCard">'+
    '<h2>'+icon('curso')+'Curso escolar '+esc(ce.actual)+
      ' <span class="badge'+(ce.abierto?' admin':'')+'" style="margin-left:6px">'+(ce.abierto?'Abierto':'Pendiente de abrir')+'</span></h2>'+
    '<div class="row" style="gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px">'+
    '<p class="desc" style="flex:1;min-width:280px;margin:0">Cada año, en la <b>fecha de corte</b>, la sincronización de todo el mundo se cierra sola: se retiran las etiquetas del centro de sus contactos (se conservan en «Mis contactos»), el profesorado pierde los contactos de alumnado, se eliminan los cursos de alumnado y se desactiva la sincronización diaria. '+
      'Después, un administrador revisa el claustro y <b>abre el nuevo curso</b>; entonces cada persona vuelve a activar su sincronización si quiere.</p>'+
      '<div style="flex:none">'+
        '<span style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px">Fecha de corte</span>'+
        '<div class="row" style="gap:8px;flex-wrap:nowrap">'+
          '<select id="corteDia" style="width:auto" aria-label="Día">'+dias+'</select>'+
          '<select id="corteMes" style="width:auto" aria-label="Mes">'+meses+'</select>'+
          '<button class="btn" id="bCorte">'+icon('guardar')+'Guardar</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (ce.abierto ? '' :
      '<div class="callout warn" style="margin-bottom:12px">'+icon('alerta')+'<span>Antes de abrir, actualiza la lista en <b>Contactos del centro</b> (importa de Séneca: quien ya no esté quedará como baja) y revisa los administradores.</span></div>'+
      '<button class="btn primary" id="bAbrirCurso">'+icon('play')+'Abrir curso '+esc(ce.actual)+'</button>')+
    '<p class="status" id="sCurso"></p>'+
  '</div>';
}

function pintarConfig(cont, estado, s){
  var c = s.config || {}, d = s.defaults || {};
  var esp = (c.especialidades || d.especialidades || []).join('\n');
  var eC = c.etiquetas, eD = d.etiquetas || {};
  var grupo = (catEtq(eC,'grupo').length ? catEtq(eC,'grupo') : catEtq(eD,'grupo')).join('\n');
  var deptos = (catEtq(eC,'departamentos').length ? catEtq(eC,'departamentos') : catEtq(eD,'departamentos')).join('\n');
  var cargos = (catEtq(eC,'cargos').length ? catEtq(eC,'cargos') : catEtq(eD,'cargos')).join('\n');
  var otros = (catEtq(eC,'otros').length ? catEtq(eC,'otros') : catEtq(eD,'otros')).join('\n');
  var pend = !estado.configurado;

  cont.innerHTML = [
    (pend ? '<div class="callout warn">'+icon('alerta')+'<span><b>Falta completar la configuración.</b> Rellena estos datos y pulsa «Guardar configuración» (abajo a la derecha) para activar el centro.</span></div>' : ''),

    '<div class="cfg-top">',

      '<div class="card">',
        '<h2>'+icon('centro')+'Centro</h2>',
        '<p class="desc">Escribe el código de centro para verificarlo con el catálogo de Andalucía.</p>',
        '<div class="cfg-centro">',
          '<label class="fld"><span>Código de centro</span>',
            '<input id="codigo" placeholder="8 dígitos" value="'+esc(c.codigoCentro||'')+'"></label>',
          '<button class="btn" id="bVer">'+icon('ok')+'Verificar</button>',
          '<label class="fld" style="flex:1;min-width:200px"><span>Nombre del centro</span>',
            '<input id="nombre" placeholder="Nombre del centro" value="'+esc(c.nombreCentro||'')+'"></label>',
        '</div>',
        '<p class="status" id="sCentro"></p>',
      '</div>',

      '<div class="card admins-card">',
        '<h2>'+icon('config')+'Administradores</h2>',
        '<p class="desc">Pueden configurar el centro y editar la lista del claustro. El principal no se puede quitar (evita bloqueos).</p>',
        '<div id="adminsList"></div>',
        '<div class="row" style="margin-top:12px">',
          '<div class="ac-wrap" style="flex:1;min-width:180px">',
            '<input id="admNuevo" placeholder="Nombre, apellidos o correo…" autocomplete="off" style="width:100%">',
            '<div class="ac-list" id="admAC" hidden></div>',
          '</div>',
          '<button class="btn" id="admAdd">'+icon('add')+'Añadir</button>',
          '<button class="btn primary" id="admGuardar">'+icon('guardar')+'Guardar</button>',
        '</div>',
        '<p class="status" id="sAdmins"></p>',
      '</div>',

    '</div>',

    cursoEscolarHtml(s.cursoEscolar),

    '<div class="card">',
      '<h2>'+icon('config')+'Especialidades y etiquetas</h2>',
      '<p class="desc">Especialidades (van al campo Organización) y etiquetas por categoría (sugerencias al etiquetar en «Contactos del centro»). Una por línea en cada caja.</p>',
      '<div class="cfg-cols">',
        '<div class="cfg-col"><span>Especialidades / Dpto.</span>',
          '<textarea rows="9" id="esp" placeholder="Infantil&#10;Primaria&#10;Inglés">'+esc(esp)+'</textarea></div>',
        '<div class="cfg-col"><span>GRUPO (pertenencia)</span>',
          '<textarea rows="9" id="etqGrupo" placeholder="# Claustro 24.25&#10;PAS&#10;4º ESO A&#10;FP Elect 1">'+esc(grupo)+'</textarea>',
          '<small class="hint">Etiqueta principal. Profesorado: <b># Claustro 24.25</b>, <b>PAS</b>… (el «#» la sube arriba en Contacts). Alumnado, el curso: <b>4º ESO A</b>…</small></div>',
        '<div class="cfg-col"><span>Departamentos</span>',
          '<textarea rows="9" id="etqDeptos" placeholder="Ciencias&#10;Letras&#10;Idiomas">'+esc(deptos)+'</textarea></div>',
        '<div class="cfg-col"><span>Cargos</span>',
          '<textarea rows="9" id="etqCargos" placeholder="Dirección&#10;Jefatura de Estudios">'+esc(cargos)+'</textarea></div>',
        '<div class="cfg-col"><span>Otros</span>',
          '<textarea rows="9" id="etqOtros" placeholder="Bilingüe&#10;TDE&#10;Convivencia">'+esc(otros)+'</textarea></div>',
      '</div>',
    '</div>',

    '<button class="btn primary floatsave" id="cfgSave" hidden>'+icon('guardar')+'Guardar configuración</button>'
  ].join('');

  /* ---------- Administradores ---------- */
  var owner = (s.adminEmail||'').toLowerCase();
  var yo = (s.yo||'').toLowerCase();
  var adminsLocal = (s.adminsExtra||[]).slice();
  var claustro = s.claustro || [];   // para autocompletar correos

  function pintarAdmins(){
    var box = cont.querySelector('#adminsList');
    var filas = ['<div style="display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap">'+
      '<span class="chip solo" style="--h:'+hue(owner)+'">'+esc(s.adminEmail)+'</span>'+
      '<span class="badge admin">'+icon('config')+'Principal</span>'+(owner===yo?'<span class="muted">· tú</span>':'')+'</div>'];
    var soyPrincipal = (owner===yo);
    adminsLocal.forEach(function(e){
      var mk = soyPrincipal ? '<button class="btn sm" data-mk="'+esc(e)+'" title="Hacer administrador principal">'+icon('ok')+'Hacer principal</button>' : '';
      filas.push('<div style="display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap">'+
        '<span class="chip solo" style="--h:'+hue(e)+'">'+esc(e)+'</span>'+(e===yo?'<span class="muted">· tú</span>':'')+
        mk+
        '<button class="btn danger sm icononly" data-rm="'+esc(e)+'" title="Quitar">'+icon('borrar')+'</button></div>');
    });
    box.innerHTML = filas.join('');
    Array.prototype.forEach.call(box.querySelectorAll('button[data-rm]'), function(b){
      b.onclick = function(){ var e=b.getAttribute('data-rm'); adminsLocal = adminsLocal.filter(function(x){return x!==e;}); pintarAdmins(); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('button[data-mk]'), function(b){
      b.onclick = function(){
        var e=b.getAttribute('data-mk'), btnMk=this;
        modalConfirmar({ titulo:'Cambiar administrador principal', icono:'config', aceptar:'Sí, traspasar',
          mensaje:'¿Hacer a '+e+' administrador principal?\n\nTú dejarás de ser el principal (seguirás como administrador). Solo el principal actual puede decidir esto.',
          onAceptar:function(){
            correr(btnMk, cont.querySelector('#sAdmins'), 'Traspasando…',
              function(r){ r.hacerPrincipal(e); },
              function(res, st){ owner=(res.owner||'').toLowerCase(); adminsLocal=(res.extra||[]).slice(); pintarAdmins();
                setStatus(st, 'Administrador principal: '+res.owner+'.', 'ok'); });
          }});
      };
    });
  }
  pintarAdmins();

  function addAdmin(emailDado){
    var inp = cont.querySelector('#admNuevo'), st = cont.querySelector('#sAdmins');
    var v = String(emailDado || inp.value).trim().toLowerCase();
    if(!v) return;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ setStatus(st, 'Escribe un nombre del claustro o un correo válido.', 'err'); return; }
    if(v===owner){ setStatus(st, 'Ese ya es el administrador principal.', ''); inp.value=''; return; }
    if(adminsLocal.indexOf(v)!==-1){ setStatus(st, 'Ya está en la lista.', ''); inp.value=''; return; }
    if(v.indexOf('@g.educaand.es')===-1) setStatus(st, 'Añadido. Aviso: no es @g.educaand.es y quizá no pueda entrar en la app.', '');
    else setStatus(st, 'Añadido. Pulsa «Guardar».', '');
    adminsLocal.push(v); inp.value=''; ocultarAC(); pintarAdmins();
  }
  cont.querySelector('#admAdd').onclick = function(){ addAdmin(); };
  cont.querySelector('#admNuevo').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addAdmin(); } });

  /* Autocompletado de correos a partir de la lista del profesorado. */
  var inpAdm = cont.querySelector('#admNuevo'), acBox = cont.querySelector('#admAC');
  function ocultarAC(){ acBox.hidden = true; acBox.innerHTML = ''; }
  function pintarAC(){
    var q = inpAdm.value.trim().toLowerCase();
    if(!q){ ocultarAC(); return; }
    var ya = {}; ya[owner] = true; adminsLocal.forEach(function(e){ ya[e] = true; });
    var res = [];
    for(var i=0;i<claustro.length && res.length<8;i++){
      var p = claustro[i], mail = String(p.email||'').toLowerCase();
      if(!mail || ya[mail]) continue;
      if(((p.nombre||'')+' '+(p.apellidos||'')+' '+mail).toLowerCase().indexOf(q) !== -1) res.push(p);
    }
    if(!res.length){ ocultarAC(); return; }
    acBox.innerHTML = res.map(function(p){
      var nom = ((p.nombre||'')+' '+(p.apellidos||'')).trim() || p.email;
      return '<div class="ac-item" data-email="'+esc(p.email)+'"><b>'+esc(nom)+'</b><small>'+esc(p.email)+'</small></div>';
    }).join('');
    acBox.hidden = false;
    Array.prototype.forEach.call(acBox.querySelectorAll('.ac-item'), function(it){
      it.onmousedown = function(e){ e.preventDefault(); addAdmin(it.getAttribute('data-email')); };
    });
  }
  inpAdm.addEventListener('input', pintarAC);
  inpAdm.addEventListener('focus', pintarAC);
  inpAdm.addEventListener('blur', function(){ setTimeout(ocultarAC, 150); });
  cont.querySelector('#admGuardar').onclick = function(){
    correr(this, cont.querySelector('#sAdmins'), 'Guardando…',
      function(r){ r.guardarAdmins(adminsLocal); },
      function(res, st){ adminsLocal=(res.extra||[]).slice(); pintarAdmins();
        setStatus(st, 'Administradores guardados: '+(adminsLocal.length+1)+' en total.', 'ok'); });
  };

  // Curso escolar: abrir el nuevo curso y fecha de corte.
  var bAbrir = cont.querySelector('#bAbrirCurso');
  if(bAbrir) bAbrir.onclick = function(){
    modalConfirmar({ titulo:'Abrir curso '+s.cursoEscolar.actual, icono:'play', aceptar:'Abrir curso',
      mensaje:'¿Has revisado ya el claustro (altas y bajas) y los administradores?\n\nAl abrir, cada persona del claustro podrá volver a activar su sincronización.',
      onAceptar:function(){
        correr(bAbrir, cont.querySelector('#sCurso'), 'Abriendo…', function(r){ r.abrirCurso(); },
          function(){ recargarApp('configuracion'); });
      }});
  };
  var bCorte = cont.querySelector('#bCorte');
  if(bCorte) bCorte.onclick = function(){
    var dia = cont.querySelector('#corteDia').value, mes = cont.querySelector('#corteMes').value;
    modalConfirmar({ titulo:'Cambiar la fecha de corte', icono:'alerta', aceptar:'Guardar',
      mensaje:'La nueva fecha de corte será el '+dia+' de '+MESES_[mes-1]+'.\n\nSi esa fecha ya ha pasado este año y el curso cambia, se cerrará el curso en ese momento. ¿Continuar?',
      onAceptar:function(){
        correr(bCorte, cont.querySelector('#sCurso'), 'Guardando…', function(r){ r.guardarCorte(mes, dia); },
          function(){ recargarApp('configuracion'); });
      }});
  };

  var floatBtn = cont.querySelector('#cfgSave');
  function serializarCfg(){
    return JSON.stringify({
      codigo: cont.querySelector('#codigo').value.trim(),
      nombre: cont.querySelector('#nombre').value.trim(),
      esp: cont.querySelector('#esp').value,
      g: cont.querySelector('#etqGrupo').value, d: cont.querySelector('#etqDeptos').value,
      c: cont.querySelector('#etqCargos').value, o: cont.querySelector('#etqOtros').value
    });
  }
  var cfgInicial = serializarCfg();
  cont._sucio = function(){ return !pend && serializarCfg() !== cfgInicial; };
  // Aparece solo si hay cambios reales; si los reviertes, vuelve a ocultarse.
  function mostrarGuardar(){ floatBtn.hidden = pend ? false : (serializarCfg() === cfgInicial); }
  if(pend) floatBtn.hidden = false;   // primera configuración: siempre visible
  // El botón flotante guarda la CONFIG; no debe reaccionar al editar administradores.
  cont.addEventListener('input', function(e){ if(e.target.closest('.admins-card')) return; mostrarGuardar(); });

  cont.querySelector('#bVer').onclick = function(){
    var codigo = cont.querySelector('#codigo').value.trim();
    correr(this, cont.querySelector('#sCentro'), 'Verificando…',
      function(r){ r.verificarCentro(codigo); },
      function(res, st){
        if(res.ok){ cont.querySelector('#nombre').value = res.nombre; setStatus(st, res.nombre, 'ok'); mostrarGuardar(); }
        else setStatus(st, 'No está en el catálogo. Escribe el nombre a mano.', '');
      });
  };

  floatBtn.onclick = function(){
    var cfg = {
      codigoCentro: cont.querySelector('#codigo').value.trim(),
      nombreCentro: cont.querySelector('#nombre').value.trim(),
      especialidades: lineasCfg(cont.querySelector('#esp').value),
      etiquetas: {
        grupo: lineasCfg(cont.querySelector('#etqGrupo').value),
        departamentos: lineasCfg(cont.querySelector('#etqDeptos').value),
        cargos: lineasCfg(cont.querySelector('#etqCargos').value),
        otros: lineasCfg(cont.querySelector('#etqOtros').value)
      }
    };
    if(!cfg.nombreCentro){ modalAviso('Falta el nombre del centro.'); return; }
    var eraPend = !estado.configurado;
    this.disabled = true; this.textContent = 'Guardando…';
    google.script.run
      .withSuccessHandler(function(res){
        if(eraPend){ recargarApp('configuracion'); return; }   // primera vez: sí recargamos para activar
        // Actualiza el estado en memoria sin recargar la app.
        ESTADO.nombreCentro = res.nombreCentro;
        ESTADO.etiquetasCats = res.etiquetas;
        ESTADO.etiquetasSugeridas = [].concat(res.etiquetas.grupo||[], res.etiquetas.departamentos||[], res.etiquetas.cargos||[], res.etiquetas.otros||[]);
        if(typeof invalidarTab==='function') invalidarTab('contactosCentro');  // refresca la paleta al reabrir
        var b=document.querySelector('.brand b'); if(b) b.textContent = res.nombreCentro || ESTADO.nombreApp;
        cfgInicial = serializarCfg();   // nueva base: si no vuelves a cambiar nada, no reaparece
        floatBtn.disabled=false; floatBtn.hidden=true; floatBtn.innerHTML=icon('ok')+'Guardado';
        setTimeout(function(){ floatBtn.innerHTML=icon('guardar')+'Guardar configuración'; }, 1500);
      })
      .withFailureHandler(function(e){ floatBtn.disabled=false; floatBtn.innerHTML=icon('guardar')+'Guardar configuración'; modalAviso(mensajeError(e)); })
      .guardarConfiguracion(cfg);
  };
}
</script>
