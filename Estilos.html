<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f7f8fb; --surface:#ffffff; --surface-2:#f4f5f8; --surface-3:#ecedf3;
    --ink:#1a1b25; --ink-soft:#565a67; --ink-faint:#8a8f9c;
    --border:#e9eaf1; --border-strong:#dcdee8;
    --primary:#6558f5; --primary-strong:#5346e0; --primary-ink:#4a3fd0; --primary-soft:#6558f510;
    --on-primary:#ffffff;
    --good:#2f7d52; --good-soft:#2f7d5216; --warn:#b45309; --warn-soft:#b4530916;
    --danger:#b42318; --danger-soft:#b4231814;
    --ring:0 0 0 3px rgba(101,88,245,.26);
    --sh-sm:0 1px 2px rgba(16,24,40,.06);
    --sh-md:0 1px 2px rgba(16,24,40,.05), 0 8px 22px rgba(16,24,40,.07);
    --sh-lg:0 6px 16px rgba(16,24,40,.08), 0 24px 48px rgba(16,24,40,.10);
    --r-sm:9px; --r:13px; --r-lg:18px; --r-pill:999px;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --narrow:"Archivo Narrow","Roboto Condensed","Segoe UI Semibold",var(--sans);
    --head:"Bricolage Grotesque",var(--sans);
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1014; --surface:#171a20; --surface-2:#1d222a; --surface-3:#242a34;
      --ink:#e9eaee; --ink-soft:#a9afba; --ink-faint:#7b818c;
      --border:#262c36; --border-strong:#353c48;
      --primary:#a29bfe; --primary-strong:#b6afff; --primary-ink:#c3bdff; --primary-soft:#a29bfe14;
      --on-primary:#191436;
      --good:#5cc98a; --good-soft:#5cc98a16; --warn:#e0a44a; --warn-soft:#e0a44a16;
      --danger:#f0897f; --danger-soft:#f0897f16;
      --ring:0 0 0 3px rgba(162,155,254,.34);
      --sh-sm:0 1px 2px rgba(0,0,0,.3);
      --sh-md:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
      --sh-lg:0 6px 16px rgba(0,0,0,.45), 0 24px 48px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1014; --surface:#171a20; --surface-2:#1d222a; --surface-3:#242a34;
    --ink:#e9eaee; --ink-soft:#a9afba; --ink-faint:#7b818c;
    --border:#262c36; --border-strong:#353c48;
    --primary:#a29bfe; --primary-strong:#b6afff; --primary-ink:#c3bdff; --primary-soft:#a29bfe14;
    --on-primary:#191436;
    --good:#5cc98a; --good-soft:#5cc98a16; --warn:#e0a44a; --warn-soft:#e0a44a16;
    --danger:#f0897f; --danger-soft:#f0897f16;
    --ring:0 0 0 3px rgba(162,155,254,.34);
    --sh-sm:0 1px 2px rgba(0,0,0,.3);
    --sh-md:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
    --sh-lg:0 6px 16px rgba(0,0,0,.45), 0 24px 48px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--head); margin:0; line-height:1.15; letter-spacing:-.01em; font-weight:700}
  .ico{width:20px; height:20px; flex:none; display:inline-block; vertical-align:middle}
  .mono{font-family:var(--mono)}

  /* ---------- App shell (barra superior) ---------- */
  .appwrap{min-height:100vh; display:flex; flex-direction:column}
  .appbar{display:flex; align-items:center; gap:14px; background:var(--surface);
    padding:13px 30px; border-bottom:1px solid var(--border)}
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand .logo{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none;
    background:linear-gradient(150deg,var(--primary),var(--primary-strong)); color:#fff; box-shadow:var(--sh-sm)}
  .brand .logo .ico{width:20px;height:20px}
  .brand .txt{min-width:0}
  .brand b{display:block; font-family:var(--head); font-size:15px; font-weight:700; letter-spacing:-.02em; line-height:1.15;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .brand small{display:block; color:var(--ink-faint); font-size:12px; font-weight:500}
  .appbar-right{margin-left:auto; display:flex; align-items:center; gap:16px}
  .badge{font-size:11.5px; font-weight:600; letter-spacing:.02em; padding:5px 12px;
    border-radius:var(--r-pill); display:inline-flex; gap:6px; align-items:center; white-space:nowrap}
  .badge.admin{background:var(--primary-soft); color:var(--primary-ink)}
  .badge.prof{background:var(--surface-2); color:var(--ink-soft)}
  .badge .ico{width:14px;height:14px}
  .avatar{width:36px; height:36px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--primary),var(--primary-strong)); color:#fff; font-weight:700; font-size:15px}
  .appbar-right{flex-wrap:wrap}
  .appbar-right .sep{width:1px; height:24px; background:var(--border); margin:0 2px}
  .hdr-sync{display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap}
  /* Cabecera + pestañas fijas al hacer scroll */
  .topfixed{position:sticky; top:0; z-index:30}
  .syncarea{padding:9px 30px; background:var(--surface); border-bottom:1px solid var(--border)}
  .syncarea .status{margin:0}

  .tabbar{display:flex; gap:2px; background:var(--surface); padding:0 22px; border-bottom:1px solid var(--border);
    overflow-x:auto}
  .tabbar button{position:relative; display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    background:transparent; border:none; color:var(--ink-soft); font-family:var(--sans); font-size:14px; font-weight:500;
    padding:15px 14px; white-space:nowrap; transition:color .15s}
  .tabbar button .ico{width:18px;height:18px; color:var(--ink-faint); transition:color .15s}
  .tabbar button::after{content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2.5px;
    border-radius:3px 3px 0 0; background:transparent; transition:background .15s}
  .tabbar button:hover{color:var(--ink)}
  .tabbar button:hover .ico{color:var(--ink-soft)}
  .tabbar button.active{color:var(--primary-ink); font-weight:600}
  .tabbar button.active .ico{color:var(--primary)}
  .tabbar button.active::after{background:var(--primary)}
  .tabbar button:focus-visible{outline:none; box-shadow:var(--ring); border-radius:var(--r-sm)}
  .tabbar .dot{width:7px; height:7px; border-radius:50%; background:var(--warn)}

  .page{flex:1; width:100%; max-width:1280px; margin:0 auto; padding:30px 32px 64px}
  /* Popover de selección de grupos */
  /* Botón partido: «Sincronizar» + desplegable como una sola pieza. */
  .syncwrap{position:relative; display:inline-flex}
  .syncwrap .btn{box-shadow:none}
  .syncwrap .splitmain{border-top-right-radius:0; border-bottom-right-radius:0}
  .syncwrap .splitcaret{border-top-left-radius:0; border-bottom-left-radius:0;
    padding-left:9px; padding-right:9px; border-left:1px solid rgba(255,255,255,.32)}
  .syncwrap .splitcaret .ico{width:15px; height:15px; margin:0}
  #hSyncMenu{padding:7px 8px}
  .syncpop{position:absolute; top:calc(100% + 8px); right:0; z-index:50; width:252px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--sh-lg); padding:12px}
  .syncpop-tit{font-weight:600; font-size:13px; margin-bottom:8px}
  .syncpop-list{display:flex; flex-direction:column; gap:6px; max-height:230px; overflow-y:auto; margin-bottom:8px}
  .syncpop label{display:flex; gap:8px; align-items:center; font-size:13.5px; cursor:pointer}
  .syncpop input{accent-color:var(--primary); cursor:pointer}
  .syncpop-prop{border-top:1px solid var(--border); padding-top:8px; margin-top:2px}
  /* Configuración: cajas estrechas en fila con scroll horizontal */
  /* 172px = ancho mínimo; por encima, las cajas se reparten equidistantes el
     ancho disponible y solo se apilan cuando no caben a ese mínimo. */
  .cfg-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:14px; align-items:stretch}
  .cfg-col{display:flex; flex-direction:column; min-width:0}
  .cfg-col > span{font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px}
  /* flex:1 → las cajas llenan la altura de la columna (sin «barriga» por abajo). */
  .cfg-col textarea{width:100%; flex:1 1 auto; min-height:168px; resize:vertical}
  /* Botón Guardar flotante */
  .floatsave{position:fixed; right:26px; bottom:26px; z-index:60; border-radius:999px;
    padding-left:20px; padding-right:20px;
    box-shadow:0 12px 28px rgba(101,88,245,.42), 0 4px 12px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease}
  .floatsave:hover{transform:translateY(-2px); box-shadow:0 16px 34px rgba(101,88,245,.5), 0 6px 14px rgba(0,0,0,.2)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .floatsave{box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06)}
  }

  /* Chips de etiqueta con color por hue */
  .chip{--h:250; display:inline-flex; align-items:center; gap:4px; font-family:var(--narrow); font-size:12.5px; font-weight:600; line-height:1.6;
    padding:2px 5px 2px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.1px;
    background:color-mix(in srgb, hsl(var(--h) 65% 55%) 15%, var(--surface));
    color:color-mix(in srgb, hsl(var(--h) 62% 40%) 90%, var(--ink));
    border:1px solid color-mix(in srgb, hsl(var(--h) 60% 55%) 32%, transparent)}
  .chip.solo{padding:2px 10px}
  .chip .x{display:inline-flex; align-items:center; justify-content:center; cursor:pointer; opacity:.55; width:15px; height:15px; border-radius:50%}
  .chip .x:hover{opacity:1; background:color-mix(in srgb, hsl(var(--h) 60% 55%) 26%, transparent)}
  .chip .x svg{width:11px; height:11px}
  .chip.clic{cursor:pointer; user-select:none}
  .chip.clic:hover{filter:brightness(1.03)}
  .chip.armed{box-shadow:0 0 0 2px var(--primary), 0 0 0 4px color-mix(in srgb, var(--primary) 25%, transparent)}
  /* Paleta de etiquetas */
  .palette{display:flex; flex-direction:column; gap:9px; margin-bottom:14px; padding:12px 14px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r)}
  .pal-row{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}
  .pal-lbl{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); min-width:104px; padding-top:4px}
  .pal-chips{display:flex; gap:6px; flex-wrap:wrap; flex:1}
  .pal-tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:10px}
  .pal-tools input{max-width:190px}
  .assign-banner{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-soft); width:100%}
  .assign-banner b{color:var(--ink)}
  /* Celda de etiquetas de la rejilla */
  td.etqs{min-width:230px}
  .etq-cell{display:flex; flex-wrap:wrap; gap:5px; align-items:center; min-height:26px; padding:5px 4px}
  .etq-cell .vacio{color:var(--ink-faint); font-size:12px}
  table.claustro.asignando tbody tr{cursor:pointer}
  table.claustro.asignando tbody tr:hover{background:var(--primary-soft)}
  .pagehead{margin-bottom:22px}
  .pagehead h1{font-size:26px; font-weight:800; letter-spacing:-.02em}
  .pagehead .sub{color:var(--ink-soft); font-size:14.5px; margin-top:5px}
  .content{display:flex; flex-direction:column; gap:20px}
  .tabpanel{display:flex; flex-direction:column; gap:20px}

  /* Centro + Administradores en paralelo (se apilan si no caben). */
  .cfg-top{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; align-items:start}

  /* ---------- Modal ---------- */
  .modal-ov{position:fixed; inset:0; background:rgba(15,17,26,.5); display:flex; align-items:flex-start;
    justify-content:center; padding:8vh 16px 16px; z-index:80}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--sh-lg); width:min(620px,100%); padding:22px 24px; display:flex; flex-direction:column;
    animation:modalin .16s ease}
  @keyframes modalin{from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:none}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .modal-head h3{font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; margin:0}
  .modal-head h3 .ico{width:18px; height:18px; color:var(--primary)}
  .modal > .desc{color:var(--ink-soft); font-size:13.5px; margin:10px 0 12px}
  .modal-ta{width:100%}
  .modal-foot{display:flex; gap:10px; justify-content:flex-end; margin-top:14px}

  /* ---------- Cards ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:24px 26px; box-shadow:var(--sh-md)}
  .card h2{font-size:17.5px; font-weight:700; display:flex; align-items:center; gap:9px}
  .card h2 .ico{width:19px;height:19px;color:var(--primary)}
  .card > .desc{color:var(--ink-soft); font-size:14px; margin:6px 0 16px; max-width:64ch}
  .card + .card{margin-top:0}
  .grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; line-height:1; padding:10px 16px;
    border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    transition:background .15s, border-color .15s, transform .05s, box-shadow .15s; box-shadow:var(--sh-sm)}
  .btn .ico{width:17px;height:17px}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:none; box-shadow:var(--ring)}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
  .btn.primary:hover{background:var(--primary-strong); border-color:var(--primary-strong)}
  .btn.ghost{background:transparent; border-color:transparent; box-shadow:none}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.danger{color:var(--danger); border-color:var(--border-strong); background:var(--surface)}
  .btn.danger:hover{background:var(--danger-soft); border-color:var(--danger)}
  .btn.good{background:var(--good); border-color:var(--good); color:#fff}
  .btn.good:hover{background:var(--good); border-color:var(--good); filter:brightness(1.07)}
  .btn.sm{padding:7px 11px; font-size:13px}
  .btn:disabled{opacity:.55; cursor:default; transform:none}
  .btn.icononly{padding:8px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

  /* ---------- Forms ---------- */
  label.fld{display:block; margin-bottom:14px}
  label.fld > span{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px}
  input[type=text], input:not([type]), input[type=email], textarea, select{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--surface);
    border:1px solid var(--border-strong); border-radius:var(--r-sm); padding:10px 12px; transition:border-color .15s, box-shadow .15s}
  textarea{resize:vertical; line-height:1.5}
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--primary); box-shadow:var(--ring)}
  .check{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--border);
    border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer; margin-bottom:10px}
  .check input{width:18px; height:18px; margin-top:1px; accent-color:var(--primary); cursor:pointer; flex:none}
  .check .t{font-size:14px} .check .t small{display:block; color:var(--ink-faint); font-weight:400; font-size:12.5px; margin-top:2px}
  .fld .hint, .cfg-col .hint{display:block; margin-top:6px; font-size:12px; color:var(--ink-faint); line-height:1.45}
  .cfg-actions{display:flex; align-items:center; gap:12px; margin-bottom:2px}
  .cfg-actions .status{margin:0 auto 0 0}
  .cfg-centro{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
  .cfg-centro > .fld{margin:0}
  .cfg-centro > .fld:first-child{width:118px}
  .cfg-centro > #bVer{padding:8px 12px}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chips label{display:inline-flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:var(--r-pill); padding:6px 13px; transition:background .15s, border-color .15s}
  .chips label:hover{background:var(--surface-2)}
  .chips input{accent-color:var(--primary); cursor:pointer}
  .chips label:focus-within{box-shadow:var(--ring); border-color:var(--primary)}

  /* ---------- Table ---------- */
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--r); background:var(--surface)}
  table{border-collapse:collapse; width:100%; min-width:560px; font-size:13.5px}
  th,td{text-align:left; padding:10px 13px; border-bottom:1px solid var(--border)}
  thead th{position:sticky; top:0; background:var(--surface-2); font-size:11px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  td input{padding:6px 8px; font-size:13px; min-width:90px}

  /* Rejilla tipo hoja de cálculo */
  table.rejilla{min-width:660px}
  table.rejilla thead th{border-right:1px solid var(--border)}
  table.rejilla td{padding:0; border-right:1px solid var(--border)}
  table.rejilla td:last-child{border-right:none}
  /* Solo las celdas de texto (data-k); NUNCA la casilla de selección. */
  table.rejilla td input[data-k]{border:none; border-radius:0; background:transparent; width:100%;
    min-width:120px; padding:9px 11px; font-size:13.5px; box-shadow:none}
  table.rejilla td input[data-k]:focus{box-shadow:inset 0 0 0 2px var(--primary)}
  table.rejilla td.act{width:44px; text-align:center}
  table.rejilla td.act .btn{box-shadow:none; border-color:transparent}
  table.rejilla tbody tr:hover{background:transparent}
  /* selección y etiquetas en bloque */
  .bulkbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;
    padding:10px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r)}
  .bulkbar input{max-width:230px}
  table.rejilla th.sel-col, table.rejilla td.sel-col{width:38px; text-align:center; padding:0}
  table.rejilla .sel, table.rejilla .selall{width:17px; height:17px; min-width:0; padding:0; accent-color:var(--primary); cursor:pointer; margin:0; box-shadow:none}
  table.rejilla tbody tr.marcada{background:var(--primary-soft)}

  /* Claustro: columnas ajustadas al contenido (no estiradas), casilla muy estrecha. */
  table.rejilla.claustro{min-width:0; width:auto}
  table.rejilla.claustro th.sel-col, table.rejilla.claustro td.sel-col{width:22px; padding:0}
  table.rejilla.claustro .sel, table.rejilla.claustro .selall{width:14px; height:14px}
  table.rejilla.claustro td input[data-k]{min-width:92px}
  table.rejilla.claustro td:nth-child(4) input[data-k]{min-width:158px}  /* E-mail */
  table.rejilla.claustro td:nth-child(5) input[data-k]{min-width:98px}   /* Teléfono */

  /* Rejilla «mis» (Google contacts y propios): sin casilla, ocupa todo el ancho de la caja. */
  table.rejilla.mis{min-width:0; width:100%}
  table.rejilla.mis td input[data-k]{min-width:92px}
  table.rejilla.mis td:nth-child(3) input[data-k]{min-width:158px}  /* E-mail */
  table.rejilla.mis td:nth-child(4) input[data-k]{min-width:98px}   /* Teléfono */

  /* Puesto como «chip» editable: pastilla con color por contenido (se ajusta al texto vía size). */
  table.rejilla td.puesto-cell{padding:0 6px}
  /* Base: se ve como un campo normal (vacío o editándose, sin pastilla). */
  table.rejilla td input[data-k].chipinput{width:auto; min-width:64px; margin:4px 0; padding:6px 10px;
    font-family:var(--narrow); font-size:12.5px; font-weight:600; letter-spacing:.1px;
    border:1px solid transparent; border-radius:999px; background:transparent; color:var(--ink)}
  /* Con contenido y sin foco: pastilla de color. */
  table.rejilla td input[data-k].chipinput.aschip{min-width:0; padding:2px 10px;
