<script>
/* ===================== Utilidades ===================== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function icon(name, cls){
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(window.ICON[name]||'')+'</svg>';
}
function setStatus(el, texto, tipo){
  if(!el) return;
  var ic = tipo==='ok'?'ok':(tipo==='err'?'alerta':(tipo==='busy'?'sync':null));
  el.className = 'status'+(tipo?' '+tipo:'');
  el.innerHTML = (ic?icon(ic, tipo==='busy'?'spin':''):'')+'<span>'+esc(texto)+'</span>';
}
function mensajeError(e){
  var m=(e&&e.message)?e.message:String(e);
  if(m.indexOf('NO_MIEMBRO')!==-1) return 'No puedes sincronizar los contactos del centro porque no perteneces al claustro.';
  if(m.indexOf('NO_AUTORIZADO')!==-1) return 'No tienes permisos de administrador.';
  return 'Se ha producido un error: '+m;
}
function resumenTexto(r){
  return 'Hecho: '+r.creados+' creados, '+r.actualizados+' actualizados, '+r.sinCambios+' sin cambios'+
    (r.omitidos?', '+r.omitidos+' omitidos':'')+'.';
}
/** Ejecuta una llamada al servidor gestionando botón y estado. */
function correr(btn, st, cargando, runFn, okFn){
  if(btn) btn.disabled=true;
  setStatus(st, cargando, 'busy');
  runFn(google.script.run
    .withSuccessHandler(function(res){ if(btn) btn.disabled=false; okFn(res, st); })
    .withFailureHandler(function(e){ if(btn) btn.disabled=false; setStatus(st, mensajeError(e), 'err'); }));
}

/** Orden de columnas de las rejillas de contactos. */
var ORDEN_COLS = ['nombre','apellidos','email','telefono','puesto','grupos'];

/**
 * Habilita pegar en bloque (desde Excel/Séneca) en una rejilla: al pegar en una
 * celda, reparte el texto (tabuladores = columnas, saltos = filas) creando filas
 * nuevas si hacen falta. `anadirFila(tbody, obj)` añade una fila vacía.
 */
function habilitarPegado(tbody, anadirFila){
  tbody.addEventListener('paste', function(e){
    var inp = e.target;
    if(!inp || inp.tagName !== 'INPUT') return;
    var texto = (e.clipboardData || window.clipboardData).getData('text');
    if(!texto || (texto.indexOf('\t') === -1 && texto.indexOf('\n') === -1)) return; // valor simple → pegado normal
    e.preventDefault();
    var startCol = ORDEN_COLS.indexOf(inp.getAttribute('data-k'));
    if(startCol < 0) startCol = 0;
    var trs = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    var startRow = trs.indexOf(inp.closest('tr'));
    var lineas = texto.replace(/\r/g,'').split('\n');
    if(lineas.length && lineas[lineas.length-1] === '') lineas.pop();
    lineas.forEach(function(linea, r){
      while(tbody.querySelectorAll('tr').length <= startRow + r) anadirFila(tbody, {});
      var fila = tbody.querySelectorAll('tr')[startRow + r];
      var inputs = fila.querySelectorAll('input');
      linea.split('\t').forEach(function(val, c){
        var destino = inputs[startCol + c];
        if(destino) destino.value = val.trim();
      });
    });
  });
}

/**
 * Lanza una sincronización mostrando una barra de progreso. La barra sondea
 * getProgresoSync() mientras corre la sincronización (que va anotando el avance
 * en caché). Si el sondeo no llega en paralelo, la barra se anima y salta a
 * 100% al terminar.
 */
function lanzarSincronizacion(btn, st, opciones, onDone){
  if(btn) btn.disabled = true;
  var barra = document.createElement('div');
  barra.className = 'progress indeterminate';
  barra.innerHTML = '<div class="bar"></div>';
  st.parentNode.insertBefore(barra, st);
  var relleno = barra.querySelector('.bar');
  var fin = false, determinada = false;
  setStatus(st, 'Preparando…', 'busy');

  var poll = setInterval(function(){
    google.script.run.withSuccessHandler(function(p){
      if(fin || !p) return;
      if(p.fase === 'fusionando'){ setStatus(st, 'Evitando duplicados…', 'busy'); return; }
      if(p.total){
        if(!determinada){ barra.classList.remove('indeterminate'); determinada = true; }
        var pct = Math.max(3, Math.round(p.hechos / p.total * 100));
        relleno.style.width = pct + '%';
        setStatus(st, 'Sincronizando… ' + p.hechos + ' de ' + p.total, 'busy');
      }
    }).getProgresoSync();
  }, 1200);

  google.script.run
    .withSuccessHandler(function(res){
      fin = true; clearInterval(poll);
      barra.classList.remove('indeterminate');
      relleno.style.width = '100%';
      setStatus(st, resumenTexto(res), 'ok');
      setTimeout(function(){ if(barra.parentNode) barra.parentNode.removeChild(barra); }, 1400);
      if(btn) btn.disabled = false;
      if(onDone) onDone(true);
    })
    .withFailureHandler(function(e){
      fin = true; clearInterval(poll);
      if(barra.parentNode) barra.parentNode.removeChild(barra);
      setStatus(st, mensajeError(e), 'err');
      if(btn) btn.disabled = false;
      if(onDone) onDone(false);
    })
    .sincronizarAhora(opciones);
}

/* ===================== Arranque ===================== */
window.TABS = window.TABS || {};
var ESTADO = null, TAB_ACTIVA = null;

document.addEventListener('DOMContentLoaded', function(){ recargarApp(); });

/** (Re)carga el estado del servidor y pinta la app. Evita location.reload(),
 *  que en el iframe de Apps Script puede dejar la pantalla en blanco. */
function recargarApp(preferida){
  google.script.run
    .withSuccessHandler(function(estado){
      ESTADO=estado;
      try { construirShell(estado, preferida); }
      catch(err){ pantallaError(err); }
    })
    .withFailureHandler(function(e){ pantallaError(e); })
    .getEstadoInicial();
}
function pantallaError(e){
  document.getElementById('root').innerHTML =
    '<div class="center-screen"><div class="panel"><div class="big">'+icon('alerta')+'</div>'+
    '<h2>No se pudo cargar</h2><p>'+esc(mensajeError(e))+'</p></div></div>';
}

function tabsOrdenadas(estado){
  return Object.keys(window.TABS)
    .map(function(k){ return Object.assign({key:k}, window.TABS[k]); })
    .filter(function(t){ return !t.adminOnly || estado.esAdmin; })
    .sort(function(a,b){ return (a.orden||99)-(b.orden||99); });
}

function construirShell(estado, preferida){
  var tabs = tabsOrdenadas(estado);
  var inicial = estado.email ? estado.email.trim().charAt(0).toUpperCase() : '?';
  var necesitaConfig = estado.esAdmin && !estado.configurado;

  var nav = tabs.map(function(t){
    var dot = (t.key==='configuracion' && necesitaConfig) ? '<span class="dot" title="Pendiente de configurar"></span>' : '';
    return '<button data-tab="'+t.key+'">'+icon(t.icono)+'<span>'+esc(t.label)+'</span>'+dot+'</button>';
  }).join('');

  document.getElementById('root').innerHTML =
    '<div class="appwrap">'+
      '<div class="topfixed">'+
        '<header class="appbar">'+
          '<div class="brand"><span class="logo">'+icon('claustro')+'</span>'+
            '<span class="txt"><b>'+esc(estado.nombreCentro||estado.nombreApp)+'</b>'+
            '<small>'+esc(estado.nombreCentro?estado.nombreApp:'Sin centro configurado')+'</small></span></div>'+
          '<div class="appbar-right">'+
            '<div class="hdr-sync">'+
              '<button class="btn sm primary" id="hSync">'+icon('sync')+'Sincronizar</button>'+
              '<button class="btn sm'+(estado.diariaActiva?' danger':'')+'" id="hDiaria" title="Sincronización automática cada día">'+
                icon('power')+(estado.diariaActiva?'Diaria: activada':'Diaria: desactivada')+'</button>'+
            '</div>'+
            '<span class="sep"></span>'+
            '<span class="badge '+(estado.esAdmin?'admin':'prof')+'">'+icon(estado.esAdmin?'config':'yo')+
              (estado.esAdmin?'Administrador':'Profesorado')+'</span>'+
            '<span class="avatar" title="'+esc(estado.email||'')+'">'+esc(inicial)+'</span>'+
          '</div>'+
        '</header>'+
        '<nav class="tabbar">'+nav+'</nav>'+
        '<div class="syncarea" id="syncArea" hidden><span class="status" id="syncStatus"></span></div>'+
      '</div>'+
      '<div class="page">'+
        '<div class="pagehead"><h1 id="tb-tit"></h1><div class="sub" id="tb-sub"></div></div>'+
        '<div class="content" id="content"></div>'+
      '</div>'+
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    b.onclick = function(){ irATab(b.getAttribute('data-tab')); };
  });

  // Sincronización manual desde la cabecera (centro + propios).
  document.getElementById('hSync').onclick = function(){
    var area=document.getElementById('syncArea'); area.hidden=false;
    lanzarSincronizacion(this, document.getElementById('syncStatus'),
      {incluirCentro:true, incluirPropios:true},
      function(){ setTimeout(function(){ area.hidden=true; }, 3000); });
  };
  // Conmutar sincronización diaria desde la cabecera.
  document.getElementById('hDiaria').onclick = function(){
    var activar = !estado.diariaActiva; this.disabled=true;
    var run=google.script.run
      .withSuccessHandler(function(){ recargarApp(TAB_ACTIVA); })
      .withFailureHandler(function(e){ alert(mensajeError(e)); });
    if(activar) run.activarSincronizacionDiaria({incluirCentro:true, incluirPropios:true});
    else run.desactivarSincronizacionDiaria();
  };

  // Pestaña inicial: la preferida (si existe), o Configuración si falta, o la 1ª.
  var primera = (preferida && window.TABS[preferida] && (!window.TABS[preferida].adminOnly || estado.esAdmin))
    ? preferida : (necesitaConfig ? 'configuracion' : tabs[0].key);
  irATab(primera);
}

function irATab(key){
  TAB_ACTIVA = key;
  var t = window.TABS[key];
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function(b){
    b.classList.toggle('active', b.getAttribute('data-tab')===key);
  });
  document.getElementById('tb-tit').textContent = t.titulo || t.label;
  document.getElementById('tb-sub').textContent = t.sub || '';
  var cont = document.getElementById('content');
  cont.innerHTML = '';
  try { t.render(cont, ESTADO); }
  catch(err){
    cont.innerHTML = '<div class="card"><p class="status err">'+icon('alerta')+
      '<span>Error al mostrar esta sección: '+esc(err&&err.message?err.message:err)+'</span></p></div>';
  }
}
</script>
