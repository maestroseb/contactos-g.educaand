<script>
/**
 * Vista del ADMINISTRADOR. Registra window.VISTAS.admin.render(estado).
 * Gestiona la lista del claustro (almacén interno), permite reconfigurar el
 * centro y sincronizar en la propia cuenta.
 */
window.VISTAS = window.VISTAS || {};
window.VISTAS.admin = {
  render: function (estado) {
    var app = document.getElementById('app');
    app.innerHTML = [
      '<div class="card">',
        '<h2>Claustro de ', (estado.nombreCentro ? '<b>' + esc(estado.nombreCentro) + '</b>' : 'tu centro'), '</h2>',
        '<p class="desc">Estos son los contactos que sincroniza el profesorado y, si usas la lista, también definen quién puede entrar. Edita, añade o pega desde Séneca.</p>',
        '<div id="gridWrap"><p class="muted">Cargando claustro…</p></div>',
        '<div class="row" style="margin-top:12px">',
          '<button id="btnAdd">＋ Añadir persona</button>',
          '<button class="primary" id="btnGuardar">💾 Guardar claustro</button>',
        '</div>',
        '<p class="status" id="stAdmin"></p>',
      '</div>',

      '<div class="card">',
        '<h2>Importar desde Séneca</h2>',
        '<p class="desc">Pega filas (Apellidos, Nombre ⇥ Correo ⇥ Teléfono ⇥ Especialidad ⇥ Etiquetas). Se añaden a la tabla de arriba; luego pulsa Guardar.</p>',
        '<textarea id="pegado" rows="4" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font-family:monospace;font-size:13px"></textarea>',
        '<div class="row" style="margin-top:10px"><button id="btnImportar">Añadir a la tabla</button></div>',
        '<p class="status" id="stImport"></p>',
      '</div>',

      '<div class="card">',
        '<h2>Ajustes del centro</h2>',
        '<p class="desc">Cambia el código de centro, especialidades, etiquetas o cómo se define el claustro (grupo de Google y/o lista).</p>',
        '<div class="row"><button id="btnReconfig">⚙️ Reconfigurar centro</button></div>',
      '</div>',

      '<div class="card">',
        '<h2>Sincronizar en mi cuenta</h2>',
        '<p class="desc">Sube el claustro a tu propio Google Contacts (para comprobar el resultado).</p>',
        '<div class="row"><button class="primary" id="btnSyncMia">🔁 Sincronizar en mi cuenta</button></div>',
        '<p class="status" id="stMia"></p>',
      '</div>'
    ].join('');

    var tbody = null;
    google.script.run
      .withSuccessHandler(function (lista) { pintarGrid(lista); })
      .withFailureHandler(function (e) {
        document.getElementById('gridWrap').innerHTML = '<p class="status err">' + esc(mensajeError(e)) + '</p>';
      })
      .adminLeerContactos();

    document.getElementById('btnAdd').onclick = function () { if (tbody) anadirFilaClaustro(tbody, {}); };

    document.getElementById('btnGuardar').onclick = function () {
      var st = document.getElementById('stAdmin');
      correr(this, st, 'Guardando…',
        function (run) { run.adminGuardarContactos(leerClaustro(tbody)); },
        function (n, st) { setStatus(st, 'Guardado: ' + n + ' personas en el claustro.', 'ok'); });
    };

    document.getElementById('btnImportar').onclick = function () {
      var texto = document.getElementById('pegado').value;
      var st = document.getElementById('stImport');
      if (!texto.trim()) { setStatus(st, 'Pega antes las filas.', 'err'); return; }
      correr(this, st, 'Procesando…',
        function (run) { run.adminImportarPegado(texto); },
        function (lista, st) {
          lista.forEach(function (c) { anadirFilaClaustro(tbody, c); });
          document.getElementById('pegado').value = '';
          setStatus(st, 'Añadidas ' + lista.length + ' filas. Revisa y pulsa «Guardar claustro».', 'ok');
        });
    };

    document.getElementById('btnReconfig').onclick = function () {
      if (window.VISTAS.configurar) mostrarVista('configurar');
    };

    document.getElementById('btnSyncMia').onclick = function () {
      var st = document.getElementById('stMia');
      correr(this, st, 'Sincronizando…',
        function (run) { run.sincronizarAhora({ incluirCentro: true, incluirPropios: false }); },
        function (r, st) { setStatus(st, resumenTexto(r), 'ok'); });
    };

    function pintarGrid(lista) {
      var wrap = document.getElementById('gridWrap');
      wrap.innerHTML = '<div class="tablewrap"><table id="gridClaustro"><thead><tr>' +
        '<th>Nombre</th><th>Apellidos</th><th>E-mail</th><th>Teléfono</th><th>Puesto</th><th>Etiquetas (coma)</th><th></th>' +
        '</tr></thead><tbody></tbody></table></div>';
      tbody = wrap.querySelector('tbody');
      (lista || []).forEach(function (c) { anadirFilaClaustro(tbody, c); });
      if (!tbody.children.length) anadirFilaClaustro(tbody, {});
    }
  }
};

/* -------- helpers del grid del claustro -------- */
function anadirFilaClaustro(tbody, c) {
  var tr = document.createElement('tr');
  var campos = ['nombre', 'apellidos', 'email', 'telefono', 'puesto', 'grupos'];
  tr.innerHTML = campos.map(function (k) {
    var v = k === 'grupos' ? (c.grupos || []).join(', ') : (c[k] || '');
    return '<td><input data-k="' + k + '" value="' + esc(v) + '" style="width:100%;min-width:100px;border:1px solid var(--border);border-radius:6px;padding:5px 7px;background:var(--surface);color:var(--ink)"></td>';
  }).join('') + '<td><button class="danger">✕</button></td>';
  tr.querySelector('button').onclick = function () { tr.remove(); };
  tbody.appendChild(tr);
}
function leerClaustro(tbody) {
  if (!tbody) return [];
  return Array.prototype.slice.call(tbody.querySelectorAll('tr')).map(function (tr) {
    var o = { tipoEmail: 'Trabajo' };
    Array.prototype.slice.call(tr.querySelectorAll('input')).forEach(function (inp) {
      var k = inp.getAttribute('data-k');
      if (k === 'grupos') o.grupos = inp.value.split(',').map(function (s) { return s.trim(); }).filter(String);
      else o[k] = inp.value.trim();
    });
    return o;
  }).filter(function (o) { return o.email || o.nombre; });
}
