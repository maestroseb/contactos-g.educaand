<script>
/**
 * Vista del ADMINISTRADOR. Registra window.VISTAS.admin.render(estado).
 * Edita en línea la pestaña "⬆️ Datos" de la hoja central (la lista que
 * sincroniza todo el claustro) y permite sincronizar en la propia cuenta.
 */
window.VISTAS = window.VISTAS || {};
window.VISTAS.admin = {
  render: function (estado) {
    var app = document.getElementById('app');
    app.innerHTML = [
      '<div class="card">',
        '<h2>Lista central del centro</h2>',
        '<p class="desc">Edita aquí los contactos del ',
        (estado.nombreCentro ? '<b>' + esc(estado.nombreCentro) + '</b>' : 'centro'),
        '. Es lo que sincroniza todo el claustro. Los cambios se guardan en la pestaña ',
        '<code>⬆️ Datos</code> de la hoja central.</p>',
        '<div id="gridWrap"><p class="muted">Cargando lista…</p></div>',
        '<div class="row" style="margin-top:12px">',
          '<button id="btnAddDato">＋ Añadir contacto</button>',
          '<button class="primary" id="btnGuardarDatos">💾 Guardar lista central</button>',
        '</div>',
        '<p class="status" id="stAdmin"></p>',
      '</div>',

      '<div class="card">',
        '<h2>Sincronizar en mi cuenta</h2>',
        '<p class="desc">Sube la lista del centro a tu propio Google Contacts (para probar el resultado).</p>',
        '<div class="row"><button class="primary" id="btnSyncMia">🔁 Sincronizar el centro en mi cuenta</button></div>',
        '<p class="status" id="stMia"></p>',
      '</div>'
    ].join('');

    // Cargar la lista central en un grid editable.
    google.script.run
      .withSuccessHandler(function (data) { pintarGrid(data.cabeceras, data.filas); })
      .withFailureHandler(function (e) {
        document.getElementById('gridWrap').innerHTML =
          '<p class="status err">' + esc(mensajeError(e)) + '</p>';
      })
      .adminLeerDatos();

    document.getElementById('btnAddDato').onclick = function () {
      var tbody = document.querySelector('#gridDatos tbody');
      if (tbody) anadirFilaDato(tbody, []);
    };

    document.getElementById('btnGuardarDatos').onclick = function () {
      var st = document.getElementById('stAdmin');
      var filas = leerGrid();
      correr(this, st, 'Guardando la lista central…',
        function (run) { run.adminGuardarDatos(filas); },
        function (n, st) { setStatus(st, 'Guardado: ' + n + ' contactos en la lista central.', 'ok'); });
    };

    document.getElementById('btnSyncMia').onclick = function () {
      var st = document.getElementById('stMia');
      correr(this, st, 'Sincronizando…',
        function (run) { run.sincronizarAhora({ incluirCentro: true, incluirPropios: false }); },
        function (r, st) { setStatus(st, resumenTexto(r), 'ok'); });
    };

    function pintarGrid(cabeceras, filas) {
      var wrap = document.getElementById('gridWrap');
      wrap.innerHTML = '<div class="tablewrap"><table id="gridDatos"><thead><tr>' +
        cabeceras.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
        '<th></th></tr></thead><tbody></tbody></table></div>';
      var tbody = wrap.querySelector('tbody');
      (filas || []).forEach(function (f) { anadirFilaDato(tbody, f); });
      if (!tbody.children.length) anadirFilaDato(tbody, []);
    }
  }
};

/* -------- helpers del grid de la lista central -------- */
function anadirFilaDato(tbody, fila) {
  var n = (window.__estado && window.__estado.numColDatos) || 8;
  var tr = document.createElement('tr');
  var celdas = '';
  for (var i = 0; i < n; i++) {
    var v = fila[i] != null ? fila[i] : '';
    celdas += '<td><input value="' + esc(v) + '" style="width:100%;min-width:110px;border:1px solid var(--border);border-radius:6px;padding:5px 7px;background:var(--surface);color:var(--ink)"></td>';
  }
  tr.innerHTML = celdas + '<td><button class="danger">✕</button></td>';
  tr.querySelector('button').onclick = function () { tr.remove(); };
  tbody.appendChild(tr);
}
function leerGrid() {
  var tbody = document.querySelector('#gridDatos tbody');
  if (!tbody) return [];
  return Array.prototype.slice.call(tbody.querySelectorAll('tr')).map(function (tr) {
    return Array.prototype.slice.call(tr.querySelectorAll('input')).map(function (i) { return i.value.trim(); });
  }).filter(function (f) { return f.some(function (c) { return c !== ''; }); });
}
</script>
