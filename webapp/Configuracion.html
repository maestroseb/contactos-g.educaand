<script>
/** Pestaña CONFIGURACIÓN (solo admin). */
window.TABS = window.TABS || {};
window.TABS.configuracion = {
  orden: 2, label: 'Configuración', icono: 'config', adminOnly: true,
  titulo: 'Configuración del centro', sub: 'Ajustes generales · solo administración',
  render: function (cont, estado) {
    cont.innerHTML = '<div class="card"><p class="muted">Cargando configuración…</p></div>';
    google.script.run
      .withSuccessHandler(function (s) { pintar(cont, estado, s); })
      .withFailureHandler(function (e) { cont.innerHTML = '<div class="card"><p class="status err">'+esc(mensajeError(e))+'</p></div>'; })
      .getEstadoConfig();
  }
};

function cat(e, k){ if(!e) return []; if(Array.isArray(e)) return (k==='grupo'?e:[]); return e[k]||[]; }
function lineasDe(txt){ return String(txt||'').split('\n').map(function(s){return s.trim();}).filter(Boolean); }

function pintar(cont, estado, s){
  var c = s.config || {}, d = s.defaults || {};
  var esp = (c.especialidades || d.especialidades || []).join('\n');
  var eC = c.etiquetas, eD = d.etiquetas || {};
  var grupo = (cat(eC,'grupo').length ? cat(eC,'grupo') : cat(eD,'grupo')).join('\n');
  var deptos = (cat(eC,'departamentos').length ? cat(eC,'departamentos') : cat(eD,'departamentos')).join('\n');
  var cargos = (cat(eC,'cargos').length ? cat(eC,'cargos') : cat(eD,'cargos')).join('\n');
  var otros = (cat(eC,'otros').length ? cat(eC,'otros') : cat(eD,'otros')).join('\n');
  var pend = !estado.configurado;

  cont.innerHTML = [
    '<div class="cfg-actions">',
      '<span class="status" id="sGuardar"></span>',
      '<button class="btn primary" id="bGuardar">'+icon('guardar')+'Guardar configuración</button>',
    '</div>',

    (pend ? '<div class="callout warn">'+icon('alerta')+'<span><b>Falta completar la configuración.</b> Rellena estos datos y pulsa «Guardar configuración» para activar el centro.</span></div>' : ''),

    '<div class="card">',
      '<h2>'+icon('centro')+'Centro</h2>',
      '<p class="desc">Escribe el código de centro para verificarlo con el catálogo de Andalucía.</p>',
      '<div class="cfg-centro">',
        '<label class="fld"><span>Código de centro</span>',
          '<input id="codigo" placeholder="8 dígitos" value="'+esc(c.codigoCentro||'')+'"></label>',
        '<button class="btn" id="bVer">'+icon('ok')+'Verificar</button>',
        '<label class="fld" style="flex:1;min-width:220px"><span>Nombre del centro</span>',
          '<input id="nombre" placeholder="Nombre del centro" value="'+esc(c.nombreCentro||'')+'"></label>',
      '</div>',
      '<p class="status" id="sCentro"></p>',
    '</div>',

    '<div class="card">',
      '<h2>'+icon('config')+'Especialidades / Departamentos</h2>',
      '<p class="desc">La especialidad de cada docente (va al campo Organización del contacto). Una por línea.</p>',
      '<textarea id="esp" rows="6">'+esc(esp)+'</textarea>',
    '</div>',

    '<div class="card">',
      '<h2>'+icon('config')+'Etiquetas por categoría</h2>',
      '<p class="desc">Sugerencias que aparecerán al etiquetar en «Contactos del centro». Una por línea en cada caja.</p>',
      '<div class="grid2">',
        '<label class="fld"><span>GRUPO (pertenencia del contacto)</span>',
          '<textarea id="etqGrupo" rows="5" placeholder="# Claustro 24.25&#10;PAS&#10;4º ESO A&#10;FP Elect 1">'+esc(grupo)+'</textarea>',
          '<small class="hint">La etiqueta principal de pertenencia. En profesorado: <b># Claustro 24.25</b>, <b>PAS</b>… (el «#» la sube arriba en Contacts). En alumnado, el curso: <b>4º ESO A</b>, <b>FP Elect 1</b>…</small></label>',
        '<label class="fld"><span>DEPARTAMENTOS</span>',
          '<textarea id="etqDeptos" rows="5" placeholder="Ciencias&#10;Letras&#10;Idiomas">'+esc(deptos)+'</textarea></label>',
        '<label class="fld"><span>CARGOS</span>',
          '<textarea id="etqCargos" rows="5" placeholder="Dirección&#10;Jefatura de Estudios&#10;Secretaría">'+esc(cargos)+'</textarea></label>',
        '<label class="fld"><span>OTROS</span>',
          '<textarea id="etqOtros" rows="5" placeholder="Bilingüe&#10;TDE&#10;Convivencia">'+esc(otros)+'</textarea></label>',
      '</div>',
    '</div>'
  ].join('');

  cont.querySelector('#bVer').onclick = function(){
    var codigo = cont.querySelector('#codigo').value.trim();
    correr(this, cont.querySelector('#sCentro'), 'Verificando…',
      function(r){ r.verificarCentro(codigo); },
      function(res, st){
        if(res.ok){ cont.querySelector('#nombre').value = res.nombre; setStatus(st, res.nombre, 'ok'); }
        else setStatus(st, 'No está en el catálogo. Escribe el nombre a mano.', '');
      });
  };

  cont.querySelector('#bGuardar').onclick = function(){
    var cfg = {
      codigoCentro: cont.querySelector('#codigo').value.trim(),
      nombreCentro: cont.querySelector('#nombre').value.trim(),
      especialidades: lineasDe(cont.querySelector('#esp').value),
      etiquetas: {
        grupo: lineasDe(cont.querySelector('#etqGrupo').value),
        departamentos: lineasDe(cont.querySelector('#etqDeptos').value),
        cargos: lineasDe(cont.querySelector('#etqCargos').value),
        otros: lineasDe(cont.querySelector('#etqOtros').value)
      }
    };
    var st = cont.querySelector('#sGuardar');
    if(!cfg.nombreCentro){ setStatus(st, 'Falta el nombre del centro.', 'err'); return; }
    correr(this, st, 'Guardando…',
      function(r){ r.guardarConfiguracion(cfg); },
      function(){ recargarApp('configuracion'); });
  };
}
</script>
